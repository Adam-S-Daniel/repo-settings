defaults:
  # Prerequisite for the Dependabot unattended-merge path being rolled out
  # fleet-wide: GitHub's native auto-merge cannot be armed at all unless the
  # repo's "Allow auto-merge" setting is on. A plain repo setting (not
  # Actions-specific, not the ruleset), so it applies to every managed repo
  # here regardless of visibility -- no downgrade/skip handling needed.
  repo:
    allow_auto_merge: true
    # Merge commits only, fleet-wide. Two reasons, one measured and one
    # ergonomic.
    #
    # Measured: a squash merge collapses a branch into a NEW commit and leaves
    # the originals on no branch. A repo whose lockfile pins a commit by sha —
    # agentskills' skills.lock names the content commit its re-pin describes —
    # is then pinning something a fresh clone of the default branch does not
    # contain, and `generate_skills_lock.py --check` fails with "cannot resolve
    # ref" (reproduced on throwaway clones, 2026-08-15). agentskills had
    # already been set merge-only by hand for this; the fleet default is that
    # decision written down.
    #
    # Ergonomic: with one method enabled there is nothing for an agent to
    # choose, retry, or spend a round-trip discovering. `gh pr merge --merge`
    # is the only form that works anywhere in the fleet.
    #
    # NOT fleet-wide in practice: the three cms-platform-managed repos
    # (cms-platform, adamdaniel.ai, jodidaniel.com) carry `manage: false`
    # below, so this never reaches them. That is deliberate and load-bearing,
    # not an oversight — their Decap publish chain arms SQUASH auto-merge on
    # every editorial PR, and squash is what collapses an editor's many
    # per-save commits into one `publish: <title>` commit. They keep squash on,
    # governed by cms-platform's own repo-settings.yml.
    allow_merge_commit: true
    allow_squash_merge: false
    allow_rebase_merge: false
  actions:
    sha_pinning_required: true
    fork_pr_approval: all_external_contributors
  ruleset:
    enabled: true
    name: "default branch protection"
    enforcement: active
    require_pull_request:
      required_approving_review_count: 0
      dismiss_stale_reviews: false
      # The ruleset half of the merge-only policy above. The repo-level toggles
      # are what actually make `gh pr merge --squash` fail; this is the second
      # layer, and stating it stops the rule RE-ASSERTING squash and rebase on
      # every apply while the toggles beside it deny them.
      allowed_merge_methods: [merge]
      # "Require an approval for changes not attributed to a user" -- a
      # ruleset parameter INDEPENDENT of required_approving_review_count
      # above. Dependabot's commits are unattributed by definition, so with
      # this true a Dependabot PR needs an approving review even though the
      # count beside it is 0, and GitHub answers the merge API with
      # `mergeStateStatus=BLOCKED` / "the base branch policy prohibits the
      # merge". That is what has been failing the nightly
      # dependabot-auto-merge sweep fleet-wide -- skills-evals run
      # 32342667620 (2026-08-20, scheduled): three PRs mergeable with green
      # checks, `merged=0 updated=0 skipped=0 failed=3`.
      #
      # THE DISCRIMINATOR IS AUTHORSHIP, NOT REQUIRED CHECKS. An early read
      # of the same failure blamed `required_status_checks: []` -- i.e. that
      # repos without a required check were the failing ones. That is FALSE,
      # and it is the reading someone will reach for again: agentskills HAS a
      # required check (`pytest-windows`, declared in its overrides below) and
      # still measured this parameter true. Human-authored PRs merge fine
      # everywhere because they are attributed; only the unattended path
      # dies, which is exactly why the fleet looked healthy.
      #
      # Measured true on 2026-08-20 on every fleet ruleset visible to the
      # auditing credential -- agentskills, skills-evals, claude-memory-map,
      # wsl-automation, fastmail-actions, GHA-bench, _agent-guidance. Nobody
      # set it: GitHub defaults it to true, and until the engine learned the
      # field it could be neither applied nor reported, so this repo carried
      # a live load-bearing ruleset parameter that was undeclared and
      # unaudited.
      #
      # why: false -- the fleet deliberately built an unattended
      # dependency-merge path and this one parameter silently vetoes it. The
      # path is not unguarded: Dependabot waits out a cooldown before a PR
      # even opens (`default-days: 7`, `semver-major-days: 30` -- see
      # .github/dependabot.yml), the sweep in
      # .github/workflows/dependabot-auto-merge.yml re-checks a
      # manifest-path allowlist against the PR's own diff and refuses
      # anything outside it, it requires at least one concluded green check
      # (never zero signal), and the merge-only policy above keeps the landed
      # commit's parents intact.
      #
      # THE HONEST COST: this parameter governs EVERY unattributed change on
      # these branches, not only Dependabot's -- any App- or bot-authored
      # commit loses the same gate. With it false, an unattributed PR that
      # passes CI and the path allowlist merges into a protected default
      # branch with NO human in the loop. That is the stated intent of the
      # path rather than a side effect, and it is what the guards above exist
      # for -- but it is a real transfer of trust to the guards, and the
      # alternative is just as real: leave it true, accept that every such PR
      # waits on a human approving review, and reframe the sweep as a
      # reporter rather than a merger.
      #
      # Practically narrow today -- only write-access actors plus Dependabot
      # can open PRs here, and required_approving_review_count: 0 already lets
      # a human self-merge -- but this paragraph is what someone reads to
      # decide whether the flip was right, so it states the real scope.
      #
      # Scope note: ADR 0001's "PR + auto-merge is not a sanctioned bot-write
      # path" governs a bot PUBLISHING GENERATED DATA (badges, run summaries)
      # onto a default branch -- that still goes to a results branch.
      # Dependabot dependency PRs are the separate, already-declared
      # unattended path (see repo.allow_auto_merge at the top of this block).
      require_extra_approval_for_unattributed_changes: false
    block_force_pushes: true
    block_deletions: true
    required_status_checks: []
    admin_bypass: true
    # Fleet-standard bot writers only (each with a justifying comment) -- the
    # narrow exception to "declare bypass actors per-repo": these bots write
    # the same managed file(s) to every fleet repo, so the grant IS the fleet
    # default. Repo-specific bots go in that repo's overrides instead.
    bypass_actors:
      # agents-md-sync GitHub App (App id 4268639): pushes the managed
      # AGENTS.md (+ CLAUDE.md bridge) directly to default branches. The
      # PR-per-repo alternative produced unmergeable bot-PR spam fleet-wide
      # (18 open PRs at the time of ADR 0001).
      - actor_type: Integration
        actor_id: 4268639
        bypass_mode: always

# Bot-write policy (issue #5; docs/decisions/0001): generated data (badges, run
# summaries, dashboards) goes to a dedicated UNPROTECTED results branch -- the
# model is skills-evals' `eval-results` -- never to the protected default
# branch. The rare bot that truly must write to a default branch gets a
# `bypass_actors` grant declared HERE (auditable, drift-checked): per-repo
# overrides for repo-specific bots, `defaults:` only for a fleet-standard bot
# that writes to every managed repo (currently agents-md-sync). Never a
# hand-granted UI bypass. PR + auto-merge is not a sanctioned bot-write path in
# this fleet (the cms-platform-managed repos, excluded here, use it by their
# own design).

repos:
  # --- public, ruleset-safe (adversarially verified: no workflow pushes to main) ---
  # agentskills carries the fleet's only required status check.
  # `pytest-windows` is its Windows CI lane, added in agentskills #100 after 72
  # tests were found failing on Windows -- three of the causes in SHIPPED code,
  # on the platform most of those skills exist to run on. Left advisory, that
  # lane catches a regression only when somebody happens to look at it.
  #
  # Two preconditions were checked before listing it, because both of the ways
  # a required check hard-blocks every open PR live in the WORKFLOW, not here
  # (AGENTS.md, "A required status check gets no `concurrency` group"):
  #   * the context name is stable -- `pytest-windows` is a plain job id with
  #     no `name:` and no `matrix`, so GitHub publishes the check under the job
  #     id verbatim. Adding either renames the context, and a required context
  #     that stops being reported blocks every open PR until this line is
  #     updated to match.
  #   * agentskills' ci.yml has no `concurrency:` block at all, at either
  #     level, so no cancelled run can win the same head sha and wedge the
  #     merge API with `405 Required status check ... is cancelled`.
  # agentskills' scripts/test_ci_workflow.py parses that workflow and fails if
  # either stops holding, so this list cannot be quietly outlived.
  - name: Adam-S-Daniel/agentskills
    overrides:
      ruleset:
        required_status_checks: [pytest-windows]
  - name: Adam-S-Daniel/skills-evals
  - name: Adam-S-Daniel/claude-memory-map
  - name: Adam-S-Daniel/civic-azure-infra
  - name: Adam-S-Daniel/civic-iac-policy
  - name: Adam-S-Daniel/civic-platform-agents
  - name: jodidaniel/squarespacetemp
  # --- onboarded 2026-07-21 after the same audit: all workflows contents:read,
  #     no pushes to the default branch, every action SHA-pinned. wsl-automation
  #     already carried a hand-applied "default branch protection" ruleset
  #     (managed in place by name from here on). ---
  - name: Adam-S-Daniel/wsl-automation
  - name: Adam-S-Daniel/fastmail-actions

  # --- GHA-bench: migrated from classic branch protection to a ruleset (the
  #     fleet standard). Now managed like the other public repos. ---
  - name: Adam-S-Daniel/GHA-bench

  # --- _agent-guidance: ruleset enabled. Previously held because drift-report.yml
  #     pushed to main as the Actions bot; fixed in _agent-guidance PR #20
  #     (drift report now lands via create-pull-request), so a PR-required
  #     ruleset no longer breaks it. ---
  - name: Adam-S-Daniel/_agent-guidance

  # --- private: only SHA pinning applies. fork-PR approval (422), rulesets
  #     (403, needs Pro) and allow_auto_merge are all auto-skipped by the engine
  #     with an explicit reason.
  #
  #     allow_auto_merge is the non-obvious one: auto-merge is Pro/Team/
  #     Enterprise-only on private repos, and below that the PATCH returns 200
  #     and is silently ignored -- so it looked like it applied. Measured
  #     2026-08-11: these four went `CHANGED -> True` on the apply and read back
  #     False seven minutes later, while a public repo in the same run stuck.
  #     See schema.md, "Downgrade behavior". ---
  - name: Adam-S-Daniel/rss-inator
  - name: Adam-S-Daniel/jc
  - name: Adam-S-Daniel/agentskills-private
  - name: Adam-S-Daniel/4A

  # --- this repo, managing itself. Previously absent from this list entirely --
  #     not even a `manage: false` entry -- so the repo that holds the
  #     Administration-write App credentials was the one repo the engine never
  #     touched, and no drift on it was reportable.
  #
  #     It is PRIVATE, so of the four managed settings only SHA pinning
  #     actually lands; fork-PR approval, the ruleset and allow_auto_merge are
  #     all skipped (see the private group above). Listing it therefore does
  #     NOT protect its default branch -- that needs Pro or making the repo
  #     public, and is worth revisiting given what this repo can administer.
  #     What listing it does buy is real though: SHA pinning was OFF here
  #     (the 2026-08-11 drift report caught `actions.sha_pinning_required
  #     False -> True`), so the repo enforcing SHA pinning fleet-wide was not
  #     enforcing it on itself. And it now appears in the audit at all.
  #
  #     Ruleset-safe either way (checked 2026-08-11): all three workflows here
  #     have `contents: read` except dependabot-auto-merge.yml, and none runs
  #     `git push` -- its merges go through `gh pr merge`, which a PR-required
  #     ruleset permits. ---
  - name: Adam-S-Daniel/repo-settings

  # --- scratch/experimental: Actions hardening only, no ruleset ---
  - name: Adam-S-Daniel/scratch-jules-001
    overrides: { ruleset: { enabled: false } }
  - name: Adam-S-Daniel/scratch-claude-001
    overrides: { ruleset: { enabled: false } }
  - name: jodidaniel/scratch-claude-002
    overrides: { ruleset: { enabled: false } }

  # --- forks: excluded (upstream workflows should not be hardened downstream) ---
  - name: Adam-S-Daniel/OctopusDeploy-Api
    manage: false
  - name: Adam-S-Daniel/SonosAmpJuicePi
    manage: false

  # --- cms-platform + consumers: owned by the platform's OWN settings-as-code
  #     (repo-settings.yml manifest + rulesets). Excluded to avoid a competing
  #     source of truth (GitHub enforces the union of rulesets). ---
  - name: Adam-S-Daniel/cms-platform
    manage: false
  - name: Adam-S-Daniel/adamdaniel.ai
    manage: false
  - name: jodidaniel/jodidaniel.com
    manage: false
