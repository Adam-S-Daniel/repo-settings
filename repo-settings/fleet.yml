defaults:
  # why: the label marks PRs and issues an AI agent opens on the owner's behalf,
  # so a reader can tell agent work from the owner's at a glance (see
  # _agent-guidance ADR 0023, in progress). It must exist in EVERY managed repo
  # (both owners) or an agent's attempt to apply it fails, hence a fleet-wide
  # default, merged with per-repo labels by name (docs/decisions/0010).
  # Removing this entry does not delete the live labels.
  labels:
    - name: agent-authored
      color: D4C5F9
      description: Opened by an AI agent on the owner's behalf
  # Prerequisite for the Dependabot unattended-merge path being rolled out
  # fleet-wide: GitHub's native auto-merge cannot be armed at all unless the
  # repo's "Allow auto-merge" setting is on. A plain repo setting (not
  # Actions-specific, not the ruleset), so it applies to every managed repo
  # here regardless of visibility -- no downgrade/skip handling needed.
  # Since cms-platform#437, the fleet's dependabot-auto-merge.yml no longer
  # arms native auto-merge at all -- `gh` merges an immediately-mergeable PR
  # on the spot instead of arming when nothing is required to wait for. The
  # setting stays on regardless: the skills-lock bumper still asks for it
  # (https://github.com/Adam-S-Daniel/_agent-guidance/issues/141), and a repo
  # that does carry a required check can still put native auto-merge to use.
  repo:
    allow_auto_merge: true
    # Merge commits only, fleet-wide. Two reasons, one measured and one
    # ergonomic.
    #
    # Measured: a squash merge collapses a branch into a NEW commit and leaves
    # the originals on no branch. A repo whose lockfile pins a commit by sha —
    # agentskills' skills.lock names the content commit its re-pin describes —
    # is then pinning something a fresh clone of the default branch does not
    # contain, and `generate_skills_lock.py --check` fails with "cannot resolve
    # ref" (reproduced on throwaway clones, 2026-08-15). agentskills had
    # already been set merge-only by hand for this; the fleet default is that
    # decision written down.
    #
    # Ergonomic: with one method enabled there is nothing for an agent to
    # choose, retry, or spend a round-trip discovering. `gh pr merge --merge`
    # is the only form that works anywhere in the fleet.
    #
    # NOT fleet-wide in practice: the three cms-platform-managed repos
    # (cms-platform, adamdaniel.ai, jodidaniel.com) carry `manage: []`
    # below, so this never reaches them. That is deliberate and load-bearing,
    # not an oversight — their Decap publish chain arms SQUASH auto-merge on
    # every editorial PR, and squash is what collapses an editor's many
    # per-save commits into one `publish: <title>` commit. They keep squash on,
    # governed by cms-platform's own repo-settings.yml.
    allow_merge_commit: true
    allow_squash_merge: false
    allow_rebase_merge: false
    # Merge-commit message: GitHub's "Default message" pair fleet-wide -- the
    # classic `Merge pull request #N from <branch>` subject with the PR title
    # as its body, never the PR description.
    #
    # Measured: a closing keyword next to an issue number closes that issue
    # from ANY commit message, whatever surrounds it -- commit text is not
    # markdown, so backticks do nothing. A code span shields the keyword only
    # while it stays in a PR description. 2026-09-15 on scratch-claude-001: a
    # description quoting the keyword in a code span left its issue open under
    # MERGE_MESSAGE/PR_TITLE, and the same description closed its issue through
    # the merge commit under PR_TITLE/PR_BODY
    # (https://github.com/Adam-S-Daniel/_agent-guidance/issues/132#issuecomment-5687434470).
    # Not hypothetical: cms-platform#283 was closed unfixed by merge commit
    # 78617e1, whose message quoted the keyword in a sentence explaining why the
    # issue had to stay open, and its gap then went unwatched for 26 days.
    #
    # agentskills was the only repo in either account on PR_TITLE/PR_BODY (read
    # 2026-09-15). Its merge subjects switch from `Merge pull request` to PR
    # titles between 2026-04-29 and 2026-05-11, before this file existed, and no
    # reason is recorded in its docs, its history or here. Every other repo --
    # the three `manage: []` cms-platform repos included, which this never
    # reaches -- was already on MERGE_MESSAGE/PR_TITLE, so declaring it changes
    # agentskills alone.
    #
    # What a setting cannot cover: a message typed at merge time (`gh pr merge
    # --body`, an MCP merge call's commit_message) and branch commit messages
    # still land verbatim -- 78617e1 was the former. That half belongs to the
    # fleet guidance rule, not to this file.
    #
    # If a token does not see these fields, the engine reports a skip, never
    # drift -- the same handling as the merge-method toggles above.
    merge_commit_title: MERGE_MESSAGE
    merge_commit_message: PR_TITLE
    # "Automatically delete head branches". Not tidiness — it is what keeps
    # the fleet's own bots working.
    #
    # A bot that proposes from a FIXED branch name (skills-lock-bump/update,
    # agents-md-sync/update) refuses to force-push a branch of that name whose
    # content it did not write. That refusal is correct — it is what stops the
    # bot clobbering a reviewer's commit — but it does not distinguish "a
    # reviewer pushed here" from "this branch is the residue of a PR that
    # merged and was never deleted". In the second case the bot is disabled
    # for that repo permanently, and nothing anywhere goes red: it exits 0,
    # and the repo simply stops receiving updates.
    #
    # Measured 2026-08-25: five of the ten lock-carrying repos —
    # agentskills-private, fastmail-actions, repo-settings, wsl-automation and
    # jodidaniel/scratch-claude-002 — had been stuck exactly that way since
    # 2026-08-21, each serving a four-day-old skills bundle while its own
    # session-start verdict read OK.
    #
    # Two layers, deliberately: _agent-guidance's bumper now deletes its own
    # branch after merging, and this is the backstop for every other
    # automation that does not.
    #
    # NOT plan-gated, unlike allow_auto_merge above: GitHub honours this on
    # private repos too, so no downgrade/skip handling is needed. It does NOT
    # reach the three cms-platform-managed repos, which carry `manage: []`
    # below and are governed by cms-platform's own repo-settings.yml.
    delete_branch_on_merge: true
  actions:
    sha_pinning_required: true
    fork_pr_approval: all_external_contributors
    # Settings -> Actions -> General -> Workflow permissions (issue #51).
    # `read` keeps GITHUB_TOKEN least-privilege unless a workflow asks for
    # more in its own `permissions:` block. `false` keeps workflows from
    # opening or approving PRs with GITHUB_TOKEN -- the PR + auto-merge
    # bot-write path the policy block below does not sanction. The one
    # declared exception is skills-evals (its override, ADR 0008).
    default_workflow_permissions: read
    can_approve_pull_request_reviews: false
  # Dependabot alerts + security-update automation. Managed nowhere before
  # this group existed, and measurably off on at least some of the fleet:
  # 2026-08-31, `GET repos/{repo}/dependabot/alerts` against agentskills,
  # repo-settings, skills-evals and agentskills-private all answered HTTP 403
  # "Dependabot alerts are disabled for this repository" -- an explicit
  # feature-off message, not the ambiguous 404 the account-wide guidance
  # warns about elsewhere, so this was MEASURED rather than inferred.
  # `_agent-guidance` alone answered with a permissions error instead of that
  # feature-off message, i.e. it appeared to already have alerts ON -- which
  # is exactly the kind of undeclared per-repo divergence this manifest
  # exists to eliminate: nobody had decided the fleet should be split, it
  # just was.
  security:
    # The PREREQUISITE for everything below it: Dependabot cannot open a
    # security-update PR without an alert to resolve, so this has to be on
    # before automated_security_fixes means anything. See schema.md's
    # "security:" section for the read/write endpoints and why the engine
    # applies this leaf before the dependent one whenever both are drifting
    # and the desired state is "on".
    vulnerability_alerts: true
    # The leaf that actually matters, and the reason is a fast path this repo
    # already assumes exists. `.github/dependabot.yml` sets a deliberate
    # `cooldown` -- a minimum package age before a version-update PR opens --
    # on the stated understanding that a SECURITY ADVISORY bypasses that
    # cooldown and opens immediately regardless of age. That bypass is real on
    # GitHub, but it is only reachable when Dependabot security updates are
    # actually turned on for the repo. With this off, the cooldown is not a
    # raised floor with an emergency exit for a live CVE -- it is the ONLY
    # path, and the fleet would wait out the full cooling-off period on a
    # vulnerable dependency exactly when it can least afford to. The same
    # assumption -- security advisories bypass cooldown -- is written into the
    # account-wide guidance (`AGENTS.md`, "Dependency updates"); turning this
    # on is what makes that statement true rather than aspirational.
    automated_security_fixes: true
    # Declared even though NOTHING in this file, or the workflow that applies
    # it, can ever converge it. GitHub exposes grouped security updates only
    # through the web UI (repo Settings -> Code security & analysis) -- there
    # is no field for it anywhere in `security_and_analysis` on the repos API,
    # and no field for it in org/enterprise code-security configurations
    # either (which are org-scoped anyway, so unreachable for the fleet
    # repos that sit under a user account, not an org). Verified against
    # GitHub's own REST reference, not inferred from a failed call --
    # `integrations/terraform-provider-github` issue 3334 is the open
    # community request asking for exactly this endpoint to exist.
    #
    # The engine reports this leaf as a permanent `skip` naming the manual UI
    # path, and per-repo grouping remains expressible in a site's own
    # `.github/dependabot.yml` via `groups:` with `applies-to:
    # security-updates` for whoever wants it. Recording the intent here,
    # rather than omitting the key because nothing can act on it, is
    # deliberate: an omitted third toggle reads as "forgotten", and a declared
    # one that always reports `skipped` reads as "known, blocked, and why" --
    # which is the truth. This is the one line in `defaults:` that a run can
    # never make converge; see docs/decisions/0002 for the reasoning in full.
    grouped_security_updates: true
  ruleset:
    enabled: true
    name: "default branch protection"
    enforcement: active
    require_pull_request:
      required_approving_review_count: 0
      dismiss_stale_reviews: false
      # The ruleset half of the merge-only policy above. The repo-level toggles
      # are what actually make `gh pr merge --squash` fail; this is the second
      # layer, and stating it stops the rule RE-ASSERTING squash and rebase on
      # every apply while the toggles beside it deny them.
      allowed_merge_methods: [merge]
      # "Require an approval for changes not attributed to a user" -- a
      # ruleset parameter INDEPENDENT of required_approving_review_count
      # above. Dependabot's commits are unattributed by definition, so with
      # this true a Dependabot PR needs an approving review even though the
      # count beside it is 0, and GitHub answers the merge API with
      # `mergeStateStatus=BLOCKED` / "the base branch policy prohibits the
      # merge". That is what has been failing the nightly
      # dependabot-auto-merge sweep fleet-wide -- skills-evals run
      # 32342667620 (2026-08-20, scheduled): three PRs mergeable with green
      # checks, `merged=0 updated=0 skipped=0 failed=3`.
      #
      # THE DISCRIMINATOR IS AUTHORSHIP, NOT REQUIRED CHECKS. An early read
      # of the same failure blamed `required_status_checks: []` -- i.e. that
      # repos without a required check were the failing ones. That is FALSE,
      # and it is the reading someone will reach for again: agentskills HAS a
      # required check (`pytest-windows`, declared in its overrides below) and
      # still measured this parameter true. Human-authored PRs merge fine
      # everywhere because they are attributed; only the unattended path
      # dies, which is exactly why the fleet looked healthy.
      #
      # Measured true on 2026-08-20 on every fleet ruleset visible to the
      # auditing credential -- agentskills, skills-evals, claude-memory-map,
      # wsl-automation, fastmail-actions, GHA-bench, _agent-guidance. Nobody
      # set it: GitHub defaults it to true, and until the engine learned the
      # field it could be neither applied nor reported, so this repo carried
      # a live load-bearing ruleset parameter that was undeclared and
      # unaudited.
      #
      # why: false -- the fleet deliberately built an unattended
      # dependency-merge path and this one parameter silently vetoes it. The
      # path is not unguarded: Dependabot waits out a cooldown before a PR
      # even opens (`default-days: 7`, `semver-major-days: 30` -- see
      # .github/dependabot.yml), the sweep in
      # .github/workflows/dependabot-auto-merge.yml re-checks a
      # manifest-path allowlist against the PR's own diff and refuses
      # anything outside it, it requires every check on the head to have
      # concluded green -- at least one of them from outside its own
      # workflow -- and pins the merge to that judged head (cms-platform#437),
      # and the merge-only policy above keeps the landed commit's parents
      # intact.
      #
      # THE HONEST COST: with this false, a Dependabot PR that passes CI and
      # the path allowlist merges into a protected default branch with NO
      # human in the loop. That is the stated intent of the path rather than
      # a side effect, and it is what the guards above exist for -- but it is
      # a real transfer of trust to the guards, and the alternative is just
      # as real: leave it true, accept that every Dependabot PR waits on a
      # human approving review, and reframe the sweep as a reporter rather
      # than a merger.
      #
      # Scope note: ADR 0001's "PR + auto-merge is not a sanctioned bot-write
      # path" governs a bot PUBLISHING GENERATED DATA (badges, run summaries)
      # onto a default branch -- that still goes to a results branch.
      # Dependabot dependency PRs are the separate, already-declared
      # unattended path (see repo.allow_auto_merge at the top of this block).
      require_extra_approval_for_unattributed_changes: false
    block_force_pushes: true
    block_deletions: true
    # why: _agent-guidance ADR 0021 -- the sync delivers agent-checks.yml (or,
    # in adam-agentskills, a ci.yml job with the same id) to every fleet repo.
    # It runs .githooks/agent-checks over every commit a PR adds: the check a
    # local `--no-verify` skips. Job id `agent-checks`, no `name:`, no matrix,
    # no `concurrency:`, no `timeout-minutes`, no path filter, so it reports on
    # every pull request (the cms-platform#437 preconditions). A per-repo
    # override REPLACES this list, so each override below repeats it.
    required_status_checks: [agent-checks]
    # The repository Admin role's bypass: always | pull_request | none
    # (schema.md). The key is required wherever a ruleset is enabled and has
    # no default in the engine, so it is set here for every repo that inherits
    # the defaults. `always` lets an admin push directly to the default
    # branch; it was `true` before issue #93 and renders the same ruleset.
    # repo-settings overrides it to `pull_request` (see its element below).
    admin_bypass: always
    # Fleet-standard bot writers only (each with a justifying comment) -- the
    # narrow exception to "declare bypass actors per-repo": these bots write
    # the same managed file(s) to every fleet repo, so the grant IS the fleet
    # default. Repo-specific bots go in that repo's overrides instead.
    bypass_actors:
      # agents-md-sync GitHub App (App id 4268639): pushes the managed
      # AGENTS.md (+ CLAUDE.md bridge) directly to default branches. The
      # PR-per-repo alternative produced unmergeable bot-PR spam fleet-wide
      # (18 open PRs at the time of ADR 0001).
      - actor_type: Integration
        actor_id: 4268639
        bypass_mode: always

# Bot-write policy (issue #5; docs/decisions/0001): generated data (badges, run
# summaries, dashboards) goes to a dedicated UNPROTECTED results branch -- the
# model is skills-evals' `persistent/eval-results` -- never to the protected default
# branch. The rare bot that truly must write to a default branch gets a
# `bypass_actors` grant declared HERE (auditable, drift-checked): per-repo
# overrides for repo-specific bots, `defaults:` only for a fleet-standard bot
# that writes to every managed repo (currently agents-md-sync). Never a
# hand-granted UI bypass. PR + auto-merge is not a sanctioned bot-write path in
# this fleet (the cms-platform-managed repos, excluded here, use it by their
# own design). skills-evals' weekly roster PR (docs/decisions/0003, as
# amended 2026-09-29; issue #51) is opened and auto-merged by a dedicated
# per-repo GitHub App behind the required `test` check, not by GITHUB_TOKEN.
# The eval loop's gated PRs (fixtures in skills-evals, skill improvements and
# removals in adam-agentskills, guidance sections in _agent-guidance) are the
# second exception (docs/decisions/0012): per-repo Apps open them, they
# auto-merge behind each repo's required checks, and skills-evals' gates
# enforce their path allowlists. No setting here changes for it.
# The one repo that does get `actions.can_approve_pull_request_reviews: true` is
# skills-evals, so its scaffold gate can open DRAFT fixture PRs with
# GITHUB_TOKEN (docs/decisions/0008); tests/test_repo_settings.py fails if any
# other repo gains it, or if skills-evals' ruleset ever requires approving
# reviews while it has it.

# WHAT THIS LIST IS, AND THE TWO SETS IT IS NOT. It is what this file DECLARES:
# every element names one repo. Each element's `manage` says which surfaces
# the engine MANAGES there: `["all"]` is every surface, including any the
# engine adds later; `[]` declares the repo and manages nothing, and
# cmd_diff/cmd_apply skip it before planning anything. `manage` is required:
# an omitted one is refused rather than defaulted (schema.md, "manage";
# docs/decisions/0011). No counts here on purpose -- hand-kept ones drifted;
# count the elements, or read `coverage`'s summary line.
#
# The App's REACH is wider than either set: both installations are on "All
# repositories" (owner, 2026-08-29), so the credential this file drives can
# administer every repo in both accounts, listed here or not. Nothing here
# compares the two; `repo_settings.py coverage` does, per owner, and the weekly
# workflow files an issue naming any repo this file does not declare.
repos:
  # --- public, ruleset-safe (adversarially verified: no workflow pushes to main) ---
  # RETIRED: superseded by Adam-S-Daniel/adam-agentskills below. The owner
  # made this repo private and archived it; `manage: []` keeps it declared
  # (so `coverage` still counts it) while the engine stops planning changes
  # against an archived repo, whose settings API calls would fail.
  # Its former required check (`pytest-windows`) and the preconditions
  # recorded for it now live on the adam-agentskills entry.
  - name: Adam-S-Daniel/agentskills
    manage: []
  # adam-agentskills: the new public skills registry replacing agentskills
  # above. Same policy shape as agentskills (PR-only default branch, merge
  # commits only, SHA pinning, fork-PR approval) via the shared `defaults:`
  # block -- only the required-check override differs.
  #
  # Three status checks, not one: its ci.yml (verified 2026-09-24 via
  # `contents/.github/workflows/ci.yml`) has jobs `privacy`, `pytest` and
  # `pytest-windows`, none carrying a `name:` or `matrix:` (so each context
  # name is the stable job id), no `concurrency:` block at workflow or job
  # level (no cancelled-run-wins-the-context hazard --
  # AGENTS.md, "A required status check gets no `concurrency` group"), no
  # `timeout-minutes` on any of the three (so GitHub cannot report one
  # `cancelled` by hitting a wall), and an unfiltered `pull_request:` trigger
  # (all three report on every PR, never skipped by a path filter).
  #
  # Secret scanning + push protection: already enabled on this repo
  # (`security_and_analysis.secret_scanning.status` /
  # `.secret_scanning_push_protection.status`, both "enabled", checked
  # 2026-09-24) but NOT declared here. The engine manages both keys since
  # issue #102, but that issue was narrowed to _agent-guidance alone, so
  # declaring them here is a separate decision.
  #
  # Fourth check, `plugin-runtime-approval` (added 2026-10-08): the job in
  # .github/workflows/plugin-runtime-review.yml that holds a PR changing a
  # plugin's hooks, bin/, package.json or settings until the owner approves
  # the `plugin-runtime-review` environment (adam-agentskills ADR 0016/0017).
  # It runs ONLY on `pull_request_target` (types opened/synchronize/reopened),
  # so no push/dispatch run can publish the context; no `name:`, no matrix,
  # no `concurrency:`, no `paths:` (an ungated PR reports success at once).
  # Verified on adam-agentskills#60 before adding it here: the context landed
  # on the PR head sha, waited for the owner, and passed after approval.
  #
  # Actions event policy (added 2026-10-09): on 2026-11-02 GitHub restricts
  # `pull_request_target` on public repos by default unless an Actions policy
  # allows it (warning on
  # https://github.com/Adam-S-Daniel/adam-agentskills/actions/runs/37841935690/job/113533312463).
  # `plugin-runtime-approval` is a REQUIRED check here, so a blocked event
  # would leave every PR unmergeable. The policy is scoped to that one workflow
  # file because `allowed_events` is an allowlist for the workflows a policy
  # covers (any unlisted event is blocked), and plugin-runtime-review.yml
  # triggers only on `pull_request_target`. If that workflow ever gains a
  # trigger, list it here too or its runs are blocked. Why, and the fallback if
  # GitHub still shows the warning: docs/decisions/0009.
  - name: Adam-S-Daniel/adam-agentskills
    manage: ["all"]
    overrides:
      ruleset:
        required_status_checks: [privacy, pytest, pytest-windows, plugin-runtime-approval, agent-checks]
      actions_policies:
        - name: "plugin-runtime-review: allow pull_request_target"
          enforcement: active
          workflow_paths:
            include: [.github/workflows/plugin-runtime-review.yml]
            exclude: []
          allowed_events: [pull_request_target]
  # Five more repos gain a required status check here (cms-platform#437 --
  # https://github.com/Adam-S-Daniel/cms-platform/issues/437). WHY: the
  # account rule is that PR CI is required, and a GitHub-enforced ruleset
  # refusal is the one kind no workflow edit can reopen -- unlike the
  # workflow-level `sweep` gate #437 hardened
  # (dependabot-auto-merge.yml's job `sweep`, which stays the load-bearing
  # UNATTENDED-merge gate everywhere in this fleet), a ruleset lives outside
  # the workflow a bad edit or a compromised token could rewrite.
  #
  # The same two preconditions recorded on the adam-agentskills entry above
  # (stable context name, no `concurrency:` block), applied per repo and
  # CHECKED 2026-09-15 for each of the five:
  #   * the context name is stable -- a plain job id with no `name:` and no
  #     `matrix`, so GitHub publishes the check under the job id verbatim
  #     (AGENTS.md, "A required status check gets no `concurrency` group").
  #   * no `concurrency:` block at workflow or job level, so no cancelled run
  #     can win the same head sha and wedge the merge API with `405 Required
  #     status check ... is cancelled`.
  #   * no `timeout-minutes` on the publishing job -- GitHub reports a job it
  #     kills at its wall as `cancelled`, the same unrecoverable shape as a
  #     concurrency collision (cms-platform#1815/#285/#289).
  #   * present on every pull request to `main`:
  #       - claude-memory-map: `pull_request: branches: [main]`.
  #       - _agent-guidance: unfiltered -- it runs TWICE per head, once via
  #         `push` on `**` and once via `pull_request`, and both finish.
  #       - GHA-bench: `pull_request: branches: [main]`.
  #       - skills-evals and fastmail-actions: ONLY once their own
  #         cms-platform#437 PRs convert the workflow-level `paths:` filter
  #         to always-run + early-skip -- a REQUIRED check that a path filter
  #         can skip blocks every PR the filter skips (AGENTS.md,
  #         "Required-check + path-filter trap"). THAT is why this change has
  #         to merge AFTER those two PRs land, not alongside them.
  #
  # Deliberately NOT required, and why: claude-memory-map's `mirror`/
  # `teardown` (a cross-repo preview publisher carrying its own
  # `cancel-in-progress` group); skills-evals' Propagation `gate`/`arms` (a
  # `cancel-in-progress` group, timeout walls, matrix-named contexts, and a
  # verdict that depends on another repo's live state, none of which this
  # file can hold still); and every one of these repos' own `auto-merge`/
  # `sweep` jobs -- that pair IS the gate being hardened, not a signal to
  # gate behind.
  #
  # Merging this file to `main` runs the apply immediately
  # (`.github/workflows/repo-settings.yml`), so any PR open on one of these five repos at
  # that moment, whose head predates the check existing, needs "Update
  # branch" before the new required context can report on it at all.
  - name: Adam-S-Daniel/skills-evals
    manage: ["all"]
    overrides:
      ruleset:
        required_status_checks: [test, agent-checks]
      # why: skills-evals' scaffold gate opens DRAFT fixture PRs with the
      # workflow GITHUB_TOKEN, which GitHub allows only while "Allow GitHub
      # Actions to create and approve pull requests" is on. The same switch
      # lets GITHUB_TOKEN submit approving reviews; that grants nothing while
      # the ruleset requires 0 approving reviews, and a test fails if that
      # count is raised without revisiting this. A draft PR cannot merge, and
      # a PR opened by GITHUB_TOKEN gets no passing `test` on its own (ADR 0003,
      # amendment), so the required check still gates it. docs/decisions/0008.
      actions:
        can_approve_pull_request_reviews: true
      # The label that gate puts on the draft PRs it opens. Declared, not
      # hand-made, so a fresh skills-evals clone or a deleted label converges.
      # Removing this entry does not delete the live label.
      labels:
        - name: eval-scaffold
          color: C5DEF5
          description: Draft real-work fixture opened by the scaffold gate
      # why: the weekly roster PR is armed for auto-merge by the roster App
      # (App id 5116415). GitHub checks --match-head-commit only when
      # auto-merge is enabled, so ANY write-access actor that later pushes
      # roster/proposal retargets the armed PR (known instance: skills-evals'
      # dependabot-auto-merge.yml job holds a persisted GITHUB_TOKEN with
      # contents: write). This ruleset lets only the App and the repo Admin
      # role (actor_id 5, same encoding as admin_bypass) update that branch.
      # github-actions is deliberately NOT a bypass actor: it is the
      # Dependabot job's identity too. ORDER: skills-evals' App-push PR (moves
      # the roster push to the App) must be merged first, or the weekly roster
      # push by GITHUB_TOKEN is blocked. Removing this entry does not delete
      # the live ruleset. docs/decisions/0004; ADR 0003:
      # https://github.com/Adam-S-Daniel/skills-evals/blob/main/docs/decisions/0003-roster-merges-automatically.md
      extra_rulesets:
        - name: roster proposal branch
          target_branches: [roster/proposal]
          rules: [creation, update, deletion, non_fast_forward]
          bypass_actors:
            - {actor_type: Integration, actor_id: 5116415, bypass_mode: always}
            - {actor_type: RepositoryRole, actor_id: 5, bypass_mode: always}
        # why: the eval workflow and the usage-census publisher accumulate
        # results on `persistent/eval-results` across runs and PRs. Only
        # deletion is blocked, with no bypass actors: bots and humans still
        # push, and delete_branch_on_merge silently skips the branch.
        # Removing this entry does not delete the live ruleset.
        # docs/decisions/0007 (the standard), 0001 (the results branch).
        - name: persistent branches
          target_branches: ["persistent/**"]
          rules: [deletion]
  - name: Adam-S-Daniel/claude-memory-map
    manage: ["all"]
    overrides:
      ruleset:
        required_status_checks: [test, agent-checks]
  - name: jodidaniel/squarespacetemp
    manage: ["all"]
  # --- onboarded 2026-07-21 after the same audit: all workflows contents:read,
  #     no pushes to the default branch, every action SHA-pinned. wsl-automation
  #     already carried a hand-applied "default branch protection" ruleset
  #     (managed in place by name from here on). ---
  - name: Adam-S-Daniel/wsl-automation
    manage: ["all"]
    # All three CI jobs are required, plus the fleet default agent-checks
    # (an override replaces the default list, so it is restated here).
    # Preconditions (cms-platform#437 comment above
    # Adam-S-Daniel/skills-evals) checked against
    # https://github.com/Adam-S-Daniel/wsl-automation/pull/58 (merged
    # 2026-10-23): no on.paths (each job decides salience in an early step and
    # still reports), plain job ids with no name/matrix, no concurrency, no
    # timeout-minutes; tests/CiWorkflow.Tests.ps1 there keeps it that way.
    overrides:
      ruleset:
        required_status_checks: [shell, test, test-linux, agent-checks]
  - name: Adam-S-Daniel/fastmail-actions
