  # ai-usage-dashboard: public, onboarded 2026-10-03. Audit 2026-10-04 after
  # [PR #5](https://github.com/Adam-S-Daniel/ai-usage-dashboard/pull/5) and
  # [PR #6](https://github.com/Adam-S-Daniel/ai-usage-dashboard/pull/6)
  # merged. The read-only workflow at
  # https://github.com/Adam-S-Daniel/ai-usage-dashboard/blob/0d9f90e537fad0b16e81a2324f5b0e2441ed247d/.github/workflows/ci.yml
  # runs unfiltered on pull_request and on pushes to main. Its stable job IDs
  # are node-test and pester, with no job-name overrides, matrix, job if, or
  # concurrency at workflow or job level. Neither job nor any step sets a
  # timeout; [PR #6](https://github.com/Adam-S-Daniel/ai-usage-dashboard/pull/6)
  # adds a parsed-YAML Pester test that prevents job or step timeout
  # reintroduction. Each job detects salient changes and gates later steps
  # internally.
  # Both checks passed on main at
  # [0d9f90e](https://github.com/Adam-S-Daniel/ai-usage-dashboard/commit/0d9f90e537fad0b16e81a2324f5b0e2441ed247d):
  # [node-test](https://github.com/Adam-S-Daniel/ai-usage-dashboard/actions/runs/37196336217/job/111418884960),
  # [pester](https://github.com/Adam-S-Daniel/ai-usage-dashboard/actions/runs/37196336217/job/111418885047).
  # contents: read; preconditions MET (2026-10-04) under the
  # [required-check policy](https://github.com/Adam-S-Daniel/cms-platform/issues/437#issuecomment-5688908950).
  # No automation pushes to main: the collector only PATCHes a gist. main
  # remains the live GitHub Pages site (legacy build from main `/`), so an
  # unprotected main lets any push-capable token publish arbitrary JS on the
  # owner's github.io origin.
  - name: Adam-S-Daniel/ai-usage-dashboard
    manage: ["all"]
    overrides:
      ruleset:
        required_status_checks: [node-test, pester, agent-checks]
  # verify-actions-lock: public composite action, created 2026-10-20
  # (https://github.com/Adam-S-Daniel/verify-actions-lock); the fleet's
  # lockfile check (_agent-guidance ADR 0024) and a dependency of every repo
  # in the lockfile form, so its main is protected like theirs. Both CI jobs
  # are required: no on.paths (self-verify's action decides for itself and
  # still reports), plain job ids, no name/matrix/concurrency/timeout-minutes.
  # agent-checks was added by hand (verify-actions-lock#6), since the sync
  # skips that workflow where actions.lock pins the actions.
  - name: Adam-S-Daniel/verify-actions-lock
    manage: ["all"]
    overrides:
      ruleset:
        required_status_checks: [test, self-verify, agent-checks]

  # --- GHA-bench: migrated from classic branch protection to a ruleset (the
  #     fleet standard). Now managed like the other public repos. ---
  # required_status_checks: [test] -- see the cms-platform#437 comment above
  # Adam-S-Daniel/skills-evals for the preconditions checked 2026-09-15.
  #
  # ARCHIVED (found 2026-10-08): GitHub refuses settings changes on an
  # archived repo, so the 2026-10-08 apply failed on
  # security.vulnerability_alerts ("Failed to change dependabot alerts
  # status"). `manage: []` keeps it declared (so `coverage` still counts
  # it) while the engine stops planning changes against it, as for the
  # retired agentskills entry. The overrides below are kept ON PURPOSE, as
  # the record of its policy if it is ever unarchived: the engine still
  # validates them, and plans none of them while `manage` is `[]`.
  - name: Adam-S-Daniel/GHA-bench
    manage: []
    overrides:
      ruleset:
        required_status_checks: [test]
      # why: benchmark result branches `persistent/benchmark-fable5` and
      # `persistent/benchmark-sonnet5` are preserved results (docs/decisions/0007).
      extra_rulesets:
        - name: persistent branches
          target_branches: ["persistent/**"]
          rules: [deletion]

  # --- _agent-guidance: ruleset enabled. Previously held because drift-report.yml
  #     pushed to main as the Actions bot; fixed in _agent-guidance PR #20
  #     (drift report now lands via create-pull-request), so a PR-required
  #     ruleset no longer breaks it. ---
  # required_status_checks: [test] -- see the cms-platform#437 comment above
  # Adam-S-Daniel/skills-evals for the preconditions checked 2026-09-15.
  - name: Adam-S-Daniel/_agent-guidance
    manage: ["all"]
    overrides:
      ruleset:
        required_status_checks: [test, agent-checks]
      # why: a public repo of agent instructions and evidence, written mostly
      # by agents, so a pasted token is the likeliest leak in the fleet. Both
      # were disabled (read 2026-10-23) and are free on a public repo. Declared
      # here only, not in `defaults:`: issue #102 was narrowed to this repo on
      # 2026-10-27, so no other repo is managed for these yet.
      security:
        secret_scanning: true
        secret_scanning_push_protection: true
      # why: the changelog routine accumulates on `persistent/vendor-changelog`
      # across PRs. Only deletion is blocked, with no bypass actors: bots and
      # humans still push, and delete_branch_on_merge silently skips the
      # branch. Removing this entry does not delete the live ruleset.
      # docs/decisions/0007 (the standard), 0006 (the routine).
      extra_rulesets:
        - name: persistent branches
          target_branches: ["persistent/**"]
          rules: [deletion]

  # --- private: only SHA pinning applies. fork-PR approval (422), rulesets
  #     (403, needs Pro) and allow_auto_merge are all auto-skipped by the engine
  #     with an explicit reason.
  #
  #     allow_auto_merge is the non-obvious one: auto-merge is Pro/Team/
  #     Enterprise-only on private repos, and below that the PATCH returns 200
  #     and is silently ignored -- so it looked like it applied. Measured
  #     2026-08-11: these four went `CHANGED -> True` on the apply and read back
  #     False seven minutes later, while a public repo in the same run stuck.
  #     See schema.md, "Downgrade behavior". ---
  - name: Adam-S-Daniel/rss-inator
    manage: ["all"]
  - name: Adam-S-Daniel/jc
    manage: ["all"]
  # Renamed from Adam-S-Daniel/agentskills-private 2026-09-24 (companion
  # private repo to the new adam-agentskills public registry above). GitHub
  # redirects the old name, but the engine keys targets by name verbatim, so
  # this file has to track the rename rather than rely on the redirect.
  - name: Adam-S-Daniel/adam-agentskills-private
    manage: ["all"]
  - name: Adam-S-Daniel/4A
    manage: ["all"]
  # why: the feed writer ("Update waiting feed ...") and agents-md-sync push
  # straight to `main` as the owner. That works because the fleet default's
  # `admin_bypass: always` lets an admin push directly, and while the repo is
  # private the ruleset is skipped anyway (403). If it ever goes public,
  # revisit the writer per docs/decisions/0001: a results branch or a declared
  # bypass. Its only workflow is agent-checks, the fleet default check.
  - name: Adam-S-Daniel/waiting-feed
    manage: ["all"]
  # why: collect.yml writes its data to `persistent/alerts-data`, never to
  # `main`, so that branch outlives its PRs and needs the deletion-only entry
  # (docs/decisions/0007). A ruleset on a private repo plans as a 403 skip;
  # it is declared anyway (docs/decisions/0002). tests.yml runs its `unit` job
  # on pull_request with no paths filter or concurrency group, so it is
  # required beside the fleet default.
  - name: Adam-S-Daniel/security-alerts
    manage: ["all"]
    overrides:
      ruleset:
        required_status_checks: [agent-checks, unit]
      extra_rulesets:
        - name: persistent branches
          target_branches: ["persistent/**"]
          rules: [deletion]

  # --- this repo, managing itself. Previously absent from this list entirely --
  #     not even as an excluded element -- so the repo that holds the
  #     Administration-write App credentials was the one repo the engine never
  #     touched, and no drift on it was reportable.
  #
  #     It is PRIVATE, so of the four managed settings only SHA pinning
  #     actually lands; fork-PR approval, the ruleset and allow_auto_merge are
  #     all skipped (see the private group above). Listing it therefore does
  #     NOT protect its default branch -- that needs Pro or making the repo
  #     public. Running private repos without rulesets is a decision the owner
  #     affirmed on 2026-08-29 rather than an open question; revisit it only if
  #     the account moves to Pro or these repos go public.
  #     What listing it does buy is real though: SHA pinning was OFF here
  #     (the 2026-08-11 drift report caught `actions.sha_pinning_required
  #     False -> True`), so the repo enforcing SHA pinning fleet-wide was not
  #     enforcing it on itself. And it now appears in the audit at all.
  #
  #     Ruleset-safe either way (checked 2026-08-11, rechecked for issue #86):
  #     all five workflows here have `contents: read` except
  #     dependabot-auto-merge.yml, and none runs `git push` -- its merges go
  #     through `gh pr merge`, which a PR-required ruleset permits. ---
  - name: Adam-S-Daniel/repo-settings
    manage: ["all"]
    overrides:
      ruleset:
        # why: the fleet rule makes every CI job on pull requests a required
        # check unless AGENTS.md documents why not, so `unit` (tests.yml, which
        # always runs on PRs) joins the fleet default `agent-checks`; the other
        # PR jobs' exceptions are under AGENTS.md's "Repo-specific additions".
        # NOTHING here is enforced while the repo is private: rulesets 403
        # ("Upgrade to GitHub Pro or make this repository public") and
        # plan_ruleset records a skip. Declared anyway per
        # docs/decisions/0002, so enforcement needs no further change if the
        # repo goes public or the account moves to Pro.
        # https://github.com/Adam-S-Daniel/repo-settings/issues/86
        required_status_checks: [agent-checks, unit]
        # why: no `always` bypass of any kind on this repo (issue #93). A
        # direct push to main that touches fleet.yml or the engine runs the
        # fleet-wide admin apply with no PR and no checks, and any session
        # holding the owner's token is an admin. `pull_request` still lets an
        # admin merge a PR past the rules.
        # https://github.com/Adam-S-Daniel/repo-settings/issues/93
        admin_bypass: pull_request
        # why: this element's array replaces the defaults' array (deep_merge
        # replaces arrays), dropping agents-md-sync's `always` bypass here. It
        # needs no bypass: _agent-guidance's scripts/sync.sh falls back to
        # opening a PR with auto-merge armed when the direct push is rejected,
        # so the managed AGENTS.md still lands, through this repo's checks.
        bypass_actors: []

