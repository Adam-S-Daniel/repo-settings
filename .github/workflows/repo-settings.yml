# Central fan-out workflow: enforce repo-settings-as-code across many repos, in
# BOTH accounts, using a GitHub App (not a stored PAT).
#
# Why an App: a fine-grained PAT is scoped to ONE resource owner, so it cannot
# administer repos in a second account/org. One GitHub App installed on both
# `Adam-S-Daniel` (user) and `jodidaniel` (org) mints a fresh, short-lived
# (~1h) installation token per owner at runtime -- least privilege, nothing to
# rotate, and it reaches both. The engine already accepts `--owner`, so each
# matrix leg processes only its owner's repos with that owner's token.
#
# Runs from this repo, the canonical home of the engine (README), alongside:
#   scripts/repo_settings.py     (the engine)
#   repo-settings/fleet.yml      (the fleet config -- see repo-settings/schema.md)
#
# One-time setup (must be done by a human -- creating an App and its key cannot
# be automated):
#   1. Create a GitHub App (Settings > Developer settings > GitHub Apps) with
#      repository permissions: Administration: Read & write, Actions: Read &
#      write, Issues: Read & write (the `labels` surface writes labels),
#      Metadata: Read-only. No webhook needed.
#   2. Generate a private key; install the App on BOTH `Adam-S-Daniel` and the
#      `jodidaniel` org, granting access to the repos in fleet.yml.
#   3. In THIS repo, add: variable `REPO_SETTINGS_APP_CLIENT_ID` (the App's
#      Client ID, `Iv23li...`, on its settings page), and secret
#      `REPO_SETTINGS_APP_PRIVATE_KEY` in the `fleet-apply` ENVIRONMENT
#      (Settings > Environments), never as a repo-level secret.
#   4. Create the separate READ-ONLY App (`repo-settings-drift-read`), install
#      it on both owners, and set the repo-level variable
#      `REPO_SETTINGS_READ_APP_CLIENT_ID` and secret
#      `REPO_SETTINGS_READ_APP_PRIVATE_KEY`. The `plan` and `drift` jobs use it.
#
# Use the App's CLIENT ID, not its numeric App ID: the action's `app-id` input
# is deprecated in favour of `client-id`. The two are the same input under the
# hood (the bundle reads `getInput("client-id") || getInput("app-id")` with no
# format validation, and the value becomes the JWT `iss` claim, which GitHub
# accepts as either), so migrating needed no credential change -- but a
# straight rename would have left a window where the gate below went false and
# the fleet audit silently stopped. It was carried through a transitional
# `${{ vars.REPO_SETTINGS_APP_CLIENT_ID || vars.REPO_SETTINGS_APP_ID }}`
# instead; REPO_SETTINGS_APP_ID has since been deleted, so the fallback is gone.
# Use that same two-step if the credential is ever rotated again.
#
# The admin key lives behind the `fleet-apply` environment (issue #90, and
# issue #13 property 4): a required reviewer (the owner) and a deployment-branch
# policy of `main` only. Store `REPO_SETTINGS_APP_PRIVATE_KEY` as a secret of
# that environment, not of the repo. An environment secret takes precedence over
# a repo secret of the same name, so the job works before and after the move;
# once the repo-level copy is deleted, no workflow on any other branch, and no
# job outside the environment, can read the key.
#
# Behavior (issue #116):
#   * push to main / weekly schedule / manual dispatch -> `plan` job, with no
#     environment and no approval: mints a READ-ONLY token per owner from the
#     read App, runs `diff` for each, and sets `needs_apply`. It also runs the
#     coverage audit and files the undeclared-repo nudge.
#   * then the `repo-settings` apply job, which waits for the owner's approval
#     in `fleet-apply`, checks that the gate is still configured, and applies.
#     It runs only when the plan found drift (push, or a non-dry-run dispatch),
#     when a non-dry-run dispatch sets `force_apply`, or on the weekly schedule
#     when the plan found drift or failed. A dry-run dispatch is the plan alone
#     and asks for no approval.
#   * pull_request touching config/script -> `drift` job: drift report only
#     (fails on drift), under a token from the same READ-ONLY App. Skipped
#     until that App's `REPO_SETTINGS_READ_APP_CLIENT_ID` variable exists.

name: repo-settings

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only: show drift, apply nothing, ask for no approval"
        type: boolean
        default: false
      force_apply:
        description: "Run the gated apply even if the plan finds no drift (ignored when dry_run is set)"
        type: boolean
        default: false
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  push:
    branches: [main]
    paths:
      - "repo-settings/fleet.yml"
      - "scripts/repo_settings.py"
      - ".github/workflows/repo-settings.yml"
      - "requirements.txt"
  pull_request:
    paths:
      - "repo-settings/fleet.yml"
      - "scripts/repo_settings.py"
      - ".github/workflows/repo-settings.yml"
      - "requirements.txt"

# Each job states its own permissions; this is the floor for any that do not.
permissions:
  contents: read

jobs:
  # The ungated plan (issue #116; issue #13, properties 1 and 2). It never
  # touches the admin key and declares no environment, so it needs no
  # approval. It mints from the read-only App, narrowed to read again at mint
  # time, and asks `diff` about each owner.
  #
  # Not a matrix: matrix legs write the same job outputs and the last one to
  # finish wins, so one owner's drift could be overwritten by the other's
  # "none". Each owner gets its own mint and diff step and its own output.
  #
  # The read token cannot see ruleset `bypass_actors`, Actions policies or the
  # repo merge flags (all come back as skips, #97), so drift confined to those
  # never sets `needs_apply`, on schedule either: the owner chose (PR #113) to
  # stop approving weekly applies that change nothing over keeping a blind
  # weekly backstop for those. A settings push that finds other drift, or a
  # `force_apply` dispatch, still converges them.
  #
  # Not gated on the read App's variable, on purpose: a plan that skipped
  # would read as "nothing to apply" on push. A missing App fails the mint and
  # turns the plan red instead.
  plan:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      issues: write              # files the undeclared-repo nudge (see below)
    outputs:
      needs_apply: ${{ steps.plan_adam.outputs.drift == 'true' || steps.plan_jodidaniel.outputs.drift == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install -r requirements.txt

      - name: Mint read-only GitHub App token for Adam-S-Daniel
        id: token_adam
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.REPO_SETTINGS_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SETTINGS_READ_APP_PRIVATE_KEY }}
          owner: Adam-S-Daniel
          permission-administration: read
          permission-actions: read
          permission-issues: read
          permission-metadata: read

      - name: Mint read-only GitHub App token for jodidaniel
        id: token_jodidaniel
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.REPO_SETTINGS_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SETTINGS_READ_APP_PRIVATE_KEY }}
          owner: jodidaniel
          permission-administration: read
          permission-actions: read
          permission-issues: read
          permission-metadata: read

      # `diff` exits 0 for no drift, 1 for drift, 2 when it could not ask or
      # the config is wrong. GitHub runs this under `bash -e`, so `|| rc=$?`
      # records the code instead of dying on it (the #99 bug). Anything but 0
      # or 1 fails the plan: "could not ask" must never read as "no drift".
      - name: Plan for Adam-S-Daniel
        id: plan_adam
        env:
          GH_TOKEN: ${{ steps.token_adam.outputs.token }}
          OWNER: Adam-S-Daniel
        run: |
          set -uo pipefail
          rc=0
          python scripts/repo_settings.py diff --config repo-settings/fleet.yml --owner "$OWNER" || rc=$?
          case "$rc" in
            0) echo "drift=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "drift=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::diff for $OWNER exited $rc: it could not ask, or the config is wrong. Not planning."
               exit 1 ;;
          esac

      - name: Plan for jodidaniel
        id: plan_jodidaniel
        env:
          GH_TOKEN: ${{ steps.token_jodidaniel.outputs.token }}
          OWNER: jodidaniel
        run: |
          set -uo pipefail
          rc=0
          python scripts/repo_settings.py diff --config repo-settings/fleet.yml --owner "$OWNER" || rc=$?
          case "$rc" in
            0) echo "drift=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "drift=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::diff for $OWNER exited $rc: it could not ask, or the config is wrong. Not planning."
               exit 1 ;;
          esac

      # AFTER the plan, and it may not fail the run. A repo nobody has
      # declared yet is not a reason to withhold the settings the declared
      # ones are owed -- and a plan that goes red because someone created a
      # repo would also stop the apply on push.
      #
      # The App is installed on ALL repositories in both accounts, and
      # `fleet.yml` was kept equal to that set by hand, with nothing checking
      # that the two stay equal. A repo created next month gets no ruleset,
      # no SHA-pinning enforcement and no fork-PR approval, and says nothing
      # about it -- the same silence
      # `skills_bootstrap` had before _agent-guidance's ADR 0011.
      #
      # The read App's installation token enumerates (only an installation
      # token can ask /installation/repositories what it can reach); the REPO
      # token files the issue. Both owners in one step, so the step keeps one
      # id; each owner's exit code is its own output, `rc_<OWNER KEY>`.
      - name: Which repos does fleet.yml not declare?
        id: coverage
        continue-on-error: true
        env:
          OWNERS: Adam-S-Daniel jodidaniel
          TOKEN_ADAM_S_DANIEL: ${{ steps.token_adam.outputs.token }}
          TOKEN_JODIDANIEL: ${{ steps.token_jodidaniel.outputs.token }}
        run: |
          set -uo pipefail
          for OWNER in $OWNERS; do
            key=$(tr 'a-z-' 'A-Z_' <<<"$OWNER")
            token_var="TOKEN_$key"
            # No --show-private here: this log is public. See cmd_coverage.
            # GitHub runs this under `bash -e`; `|| rc=$?` keeps a nonzero exit
            # from killing the script before rc is recorded and the report shown.
            rc=0
            GH_TOKEN="${!token_var:-}" python scripts/repo_settings.py coverage \
              --config repo-settings/fleet.yml --owner "$OWNER" \
              > "coverage-$OWNER.txt" 2>&1 || rc=$?
            # Three-valued, and the middle one is the whole point: 0 complete,
            # 1 something undeclared, 2 the question could not be asked. A `2`
            # must never reach the issue step as "nothing undeclared".
            echo "rc_$key=$rc" >> "$GITHUB_OUTPUT"
            cat "coverage-$OWNER.txt"
          done
          exit 0

      # continue-on-error: a nudge that cannot file its issue must not fail the
      # plan, because a failed plan withholds the apply on push.
      - name: Nudge on repos fleet.yml does not declare
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNERS: Adam-S-Daniel jodidaniel
          RC_ADAM_S_DANIEL: ${{ steps.coverage.outputs.rc_ADAM_S_DANIEL }}
          RC_JODIDANIEL: ${{ steps.coverage.outputs.rc_JODIDANIEL }}
        run: |
          set -euo pipefail
          nudge() {
            local OWNER=$1 RC=$2
            # EXPORTED, because the jq filter below reads it as `env.title`.
            # A shell local would be invisible there, the filter would match
            # nothing, and every run would open a fresh duplicate issue while
            # never closing one.
            export title="Undeclared in fleet.yml: $OWNER"
            local report="coverage-$OWNER.txt" existing

            if [[ "${RC:-2}" == "2" ]]; then
              echo "::warning::coverage could not enumerate $OWNER — concluding nothing, and leaving any open nudge alone"
              return 0
            fi

            existing=$(gh issue list --state open --label ci \
              --search "$title in:title" --json number,title \
              --jq "[.[] | select(.title == env.title)] | .[0].number // empty")

            if [[ "$RC" == "0" ]]; then
              if [[ -n "$existing" ]]; then
                gh issue close "$existing" --comment \
                  "Every repository the App can administer under \`$OWNER\` is now declared in \`fleet.yml\`. Closed by the weekly run."
              fi
              return 0
            fi

            # Body from a file, never an argument: repo names are data, and the
            # command line is echoed into a log.
            {
              echo "The repo-settings App can administer repositories under \`$OWNER\` that \`repo-settings/fleet.yml\` does not declare."
              echo
              echo "Undeclared means nobody has decided about them -- not that they should be managed. Declaring one with \`manage: []\` is a perfectly good answer, and is what the two forks carry today; what is not an answer is absence, because absence and a deliberate omission look identical."
              echo
              echo "Until a repo is declared it gets no ruleset, no SHA-pinning enforcement and no fork-PR approval requirement, and nothing says so."
              echo
              echo '```'
              grep '^UNDECLARED' "$report" || true
              echo '```'
              echo
              echo "Names of undeclared private repositories are withheld because this issue is public. To see them, run \`python3 scripts/repo_settings.py coverage --config repo-settings/fleet.yml --owner $OWNER --show-private\` locally."
              echo
              echo "Add each to \`repos:\` in \`repo-settings/fleet.yml\`, with \`manage: [\"all\"]\` to manage it or \`manage: []\` to leave it alone. This issue closes itself on the next weekly run."
            } > /tmp/coverage-body.md

            if [[ -n "$existing" ]]; then
              gh issue edit "$existing" --body-file /tmp/coverage-body.md
            else
              gh issue create --title "$title" --label ci --body-file /tmp/coverage-body.md
            fi
          }

          for OWNER in $OWNERS; do
            key=$(tr 'a-z-' 'A-Z_' <<<"$OWNER")
            rc_var="RC_$key"
            nudge "$OWNER" "${!rc_var:-}"
          done

  repo-settings:
    runs-on: ubuntu-latest
    needs: plan
    # Runs only when (issue #116):
    #   * the event is `schedule` and the plan found drift, or the plan did
    #     not succeed (say the read App is broken): a weekly run that cannot
    #     rule drift out still applies, failing closed;
    #   * the plan succeeded and found drift, on push or on a dispatch that is
    #     not a dry run;
    #   * the plan succeeded and a dispatch that is not a dry run sets
    #     `force_apply`.
    # A dry-run dispatch never gets here: it is the plan alone. Outside
    # schedule, a failed or skipped plan never triggers an apply.
    #
    # `!cancelled()` because GitHub skips a dependent job whose `needs` failed
    # unless `if:` calls a status function; the failed-plan schedule case needs that,
    # and every other branch requires `needs.plan.result == 'success'`. Not
    # `always()`: a run someone cancelled should not go on to ask for an apply.
    #
    # Skip cleanly until the admin App is configured. Never on pull_request:
    # a PR branch controls its own copy of this file, so the job that holds
    # the admin key must not run there at all; `drift` below covers PRs.
    if: >-
      ${{ !cancelled()
      && vars.REPO_SETTINGS_APP_CLIENT_ID != ''
      && github.event_name != 'pull_request'
      && ((github.event_name == 'schedule'
      && (needs.plan.result != 'success' || needs.plan.outputs.needs_apply == 'true'))
      || (needs.plan.result == 'success'
      && ((github.event_name == 'push' && needs.plan.outputs.needs_apply == 'true')
      || (github.event_name == 'workflow_dispatch' && !inputs.dry_run
      && (needs.plan.outputs.needs_apply == 'true' || inputs.force_apply))))) }}
    # The approval gate. GitHub pauses the job here, before its first step,
    # until a required reviewer approves, and serves the environment's secrets
    # only after that.
    environment: fleet-apply
    # Serialize applies per owner, here and not at workflow level. A run waiting
    # for approval holds its group, so a workflow-level group would make PR
    # `drift` runs queue behind it or replace each other. The group carries the
    # matrix owner: one fixed name would put both legs in one group, so they
    # would run one after another (likely two approvals), and a newly queued
    # run would cancel the waiting leg, applying to one owner only.
    concurrency:
      group: repo-settings-${{ matrix.owner }}
      cancel-in-progress: false
    # Job-level permissions replace the workflow-level block, so restate it.
    # `actions: read` is what the environment self-check's two GETs need. No
    # `issues: write`: the nudge moved to `plan`.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        owner: [Adam-S-Daniel, jodidaniel]
    steps:
      # Naming an environment that does not exist does not fail: GitHub creates
      # it with no protection rules, and the gate silently disappears (issue
      # #13, property 4). So before anything applies, ask GitHub what
      # `fleet-apply` actually enforces and refuse unless it has a required
      # reviewer and deploys from `main` only. Fails closed: any API error or
      # unreadable response fails the job. No `if:` and no
      # `continue-on-error`, on purpose; tests/test_repo_settings_workflow_token.py
      # holds it first and runs this script against fake responses.
      - name: Check the fleet-apply environment still gates this job
        id: environment_gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENVIRONMENT: fleet-apply
        run: |
          set -euo pipefail
          env_json=$(gh api "repos/$REPO/environments/$ENVIRONMENT")
          policies_json=$(gh api "repos/$REPO/environments/$ENVIRONMENT/deployment-branch-policies")
          if ! jq -e '[.protection_rules[]? | select(.type == "required_reviewers") | (.reviewers // []) | length] | any(. > 0)' \
              <<<"$env_json" >/dev/null; then
            echo "::error::Environment $ENVIRONMENT has no required reviewer, so nothing gates the admin key. Add one before applying."
            exit 1
          fi
          if ! jq -e '.deployment_branch_policy.custom_branch_policies == true' <<<"$env_json" >/dev/null; then
            echo "::error::Environment $ENVIRONMENT does not restrict deployments to selected branches. Allow only main."
            exit 1
          fi
          if ! jq -e '.total_count == 1 and ([.branch_policies[]? | [.name, (.type // "branch")]] == [["main", "branch"]])' \
              <<<"$policies_json" >/dev/null; then
            echo "::error::Environment $ENVIRONMENT's deployment-branch policies are not exactly the branch main."
            exit 1
          fi
          echo "Environment $ENVIRONMENT: a required reviewer is configured and only main may deploy."

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install -r requirements.txt

      - name: Mint GitHub App token for ${{ matrix.owner }}
        id: token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.REPO_SETTINGS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SETTINGS_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}

      - name: Apply
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: python scripts/repo_settings.py apply --config repo-settings/fleet.yml --owner ${{ matrix.owner }}

  # The pull_request drift report. It never touches the admin key: a PR branch
  # controls its own copy of this workflow, so any job that can run on a PR
  # could read whatever secret it names (closed PR #95). It mints from a
  # SEPARATE App that holds only read permissions, so its key exposes reads
  # if it ever leaks, and its token is narrowed to read again at mint time.
  #
  # It is the same read-only App the `plan` job uses. SKIPPED while the
  # repo-level variable `REPO_SETTINGS_READ_APP_CLIENT_ID` (and secret
  # `REPO_SETTINGS_READ_APP_PRIVATE_KEY`) is unset (issue #90). Reads that need write (the Actions
  # policies endpoints, GET included) come back as informational skips, never
  # drift (#97). Dependabot and fork PRs get no secrets, so it fails to mint
  # there; it is advisory and not a required check (AGENTS.md).
  drift:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && vars.REPO_SETTINGS_READ_APP_CLIENT_ID != '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        owner: [Adam-S-Daniel, jodidaniel]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install -r requirements.txt

      - name: Mint read-only GitHub App token for ${{ matrix.owner }}
        id: token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.REPO_SETTINGS_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SETTINGS_READ_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          permission-administration: read
          permission-actions: read
          permission-issues: read
          permission-metadata: read

      - name: Drift report
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ matrix.owner }}
        run: python scripts/repo_settings.py diff --config repo-settings/fleet.yml --owner "$OWNER"
