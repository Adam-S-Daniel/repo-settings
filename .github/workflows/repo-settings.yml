# Central fan-out workflow: enforce repo-settings-as-code across many repos, in
# BOTH accounts, using a GitHub App (not a stored PAT).
#
# Why an App: a fine-grained PAT is scoped to ONE resource owner, so it cannot
# administer repos in a second account/org. One GitHub App installed on both
# `Adam-S-Daniel` (user) and `jodidaniel` (org) mints a fresh, short-lived
# (~1h) installation token per owner at runtime -- least privilege, nothing to
# rotate, and it reaches both. The engine already accepts `--owner`, so each
# matrix leg processes only its owner's repos with that owner's token.
#
# Runs from this repo, the canonical home of the engine (README), alongside:
#   scripts/repo_settings.py     (the engine)
#   repo-settings/fleet.yml      (the fleet config -- see repo-settings/schema.md)
#
# One-time setup (must be done by a human -- creating an App and its key cannot
# be automated):
#   1. Create a GitHub App (Settings > Developer settings > GitHub Apps) with
#      repository permissions: Administration: Read & write, Actions: Read &
#      write, Issues: Read & write (the `labels` surface writes labels),
#      Metadata: Read-only. No webhook needed.
#   2. Generate a private key; install the App on BOTH `Adam-S-Daniel` and the
#      `jodidaniel` org, granting access to the repos in fleet.yml.
#   3. In THIS repo, add: variable `REPO_SETTINGS_APP_CLIENT_ID` (the App's
#      Client ID, `Iv23li...`, on its settings page), and secret
#      `REPO_SETTINGS_APP_PRIVATE_KEY` in the `fleet-apply` ENVIRONMENT
#      (Settings > Environments), never as a repo-level secret.
#   4. Create the separate READ-ONLY App (`repo-settings-drift-read`), install
#      it on both owners, and set the repo-level variable
#      `REPO_SETTINGS_READ_APP_CLIENT_ID` and secret
#      `REPO_SETTINGS_READ_APP_PRIVATE_KEY`. The `plan` and `drift` jobs use it.
#   5. Optional, and what lets tightening changes apply with no approval
#      (docs/decisions/0019): create the environment `fleet-apply-auto` with
#      NO required reviewer, set its deployment branches to "Selected
#      branches" with exactly `main`, and add `REPO_SETTINGS_APP_PRIVATE_KEY`
#      to it as an environment secret (the same key as in `fleet-apply`).
#      Until all three are true the `apply-auto` job applies nothing and
#      every change waits for the reviewed apply, as before.
#
# Use the App's CLIENT ID, not its numeric App ID: the action's `app-id` input
# is deprecated in favour of `client-id`. The two are the same input under the
# hood (the bundle reads `getInput("client-id") || getInput("app-id")` with no
# format validation, and the value becomes the JWT `iss` claim, which GitHub
# accepts as either), so migrating needed no credential change -- but a
# straight rename would have left a window where the gate below went false and
# the fleet audit silently stopped. It was carried through a transitional
# `${{ vars.REPO_SETTINGS_APP_CLIENT_ID || vars.REPO_SETTINGS_APP_ID }}`
# instead; REPO_SETTINGS_APP_ID has since been deleted, so the fallback is gone.
# Use that same two-step if the credential is ever rotated again.
#
# The admin key lives behind the `fleet-apply` environment (issue #90, and
# issue #13 property 4): a required reviewer (the owner) and a deployment-branch
# policy of `main` only. Store `REPO_SETTINGS_APP_PRIVATE_KEY` as a secret of
# that environment, not of the repo. An environment secret takes precedence over
# a repo secret of the same name, so the job works before and after the move;
# once the repo-level copy is deleted, no workflow on any other branch, and no
# job outside the environment, can read the key.
#
# Behavior (issue #116):
#   * push to main / weekly schedule / manual dispatch -> `plan` job, with no
#     environment and no approval: mints a READ-ONLY token per owner from the
#     read App, runs `diff` for each, and sets `needs_apply`. It also runs the
#     coverage audit and files the undeclared-repo nudge.
#   * then the `apply-auto` job (docs/decisions/0019), with no approval: it
#     re-plans under the admin token and makes only the writes the engine can
#     show cannot reduce protection (`apply --refuse-weakening`). It runs when
#     the plan found drift (push, or a non-dry-run dispatch), when a
#     non-dry-run dispatch sets `force_apply`, or on the weekly schedule when
#     the plan found drift or failed. A dry-run dispatch is the plan alone.
#   * then the `repo-settings` apply job, only when `apply-auto` left a change
#     behind or could not say that it left none. It waits for the owner's
#     approval in `fleet-apply`, checks that the gate is still configured, and
#     applies everything. In both apply jobs the cms-platform repos' labels
#     are applied by a separate step under an issues-only token
#     (docs/decisions/0016).
#   * pull_request touching config/script -> `drift` job: drift report only
#     (fails on drift), under a token from the same READ-ONLY App. Skipped
#     until that App's `REPO_SETTINGS_READ_APP_CLIENT_ID` variable exists.

name: repo-settings

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only: show drift, apply nothing, ask for no approval"
        type: boolean
        default: false
      force_apply:
        description: "Run the gated apply even if the plan finds no drift (ignored when dry_run is set)"
        type: boolean
        default: false
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  push:
    branches: [main]
    paths:
      - "repo-settings/fleet.yml"
      - "scripts/repo_settings.py"
      - ".github/workflows/repo-settings.yml"
      - "requirements.txt"
  pull_request:
    paths:
      - "repo-settings/fleet.yml"
      - "scripts/repo_settings.py"
      - ".github/workflows/repo-settings.yml"
      - "requirements.txt"

# Each job states its own permissions; this is the floor for any that do not.
permissions:
  contents: read

jobs:
  # The ungated plan (issue #116; issue #13, properties 1 and 2). It never
  # touches the admin key and declares no environment, so it needs no
  # approval. It mints from the read-only App, narrowed to read again at mint
  # time, and asks `diff` about each owner.
  #
  # Not a matrix: matrix legs write the same job outputs and the last one to
  # finish wins, so one owner's drift could be overwritten by the other's
  # "none". Each owner gets its own mint and diff step and its own output.
  #
  # The read token cannot see ruleset `bypass_actors`, Actions policies or the
  # repo merge flags (all come back as skips, #97), so drift confined to those
  # never sets `needs_apply`, on schedule either: the owner chose (PR #113) to
  # stop approving weekly applies that change nothing over keeping a blind
  # weekly backstop for those. A settings push that finds other drift, or a
  # `force_apply` dispatch, still converges `bypass_actors` and Actions
  # policies. Not the merge flags: the admin App has no Contents either, so the
  # apply skips them too and only an operator `apply` converges them.
  #
  # Not gated on the read App's variable, on purpose: a plan that skipped
  # would read as "nothing to apply" on push. A missing App fails the mint and
  # turns the plan red instead.
  plan:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      issues: write              # files the undeclared-repo nudge (see below)
    outputs:
      needs_apply: ${{ steps.plan_adam.outputs.drift == 'true' || steps.plan_jodidaniel.outputs.drift == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install -r requirements.txt

      - name: Mint read-only GitHub App token for Adam-S-Daniel
        id: token_adam
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.REPO_SETTINGS_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SETTINGS_READ_APP_PRIVATE_KEY }}
          owner: Adam-S-Daniel
          permission-administration: read
          permission-actions: read
          permission-issues: read
          permission-metadata: read

      - name: Mint read-only GitHub App token for jodidaniel
        id: token_jodidaniel
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.REPO_SETTINGS_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SETTINGS_READ_APP_PRIVATE_KEY }}
          owner: jodidaniel
          permission-administration: read
          permission-actions: read
          permission-issues: read
          permission-metadata: read

      # `diff` exits 0 for no drift, 1 for drift, 2 when it could not ask or
      # the config is wrong. GitHub runs this under `bash -e`, so `|| rc=$?`
      # records the code instead of dying on it (the #99 bug). Anything but 0
      # or 1 fails the plan: "could not ask" must never read as "no drift".
      - name: Plan for Adam-S-Daniel
        id: plan_adam
        env:
          GH_TOKEN: ${{ steps.token_adam.outputs.token }}
          OWNER: Adam-S-Daniel
        run: |
          set -uo pipefail
          rc=0
          python scripts/repo_settings.py diff --config repo-settings/fleet.yml --owner "$OWNER" \
            --changes-json "changes-$OWNER.json" || rc=$?
          case "$rc" in
            0) echo "drift=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "drift=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::diff for $OWNER exited $rc: it could not ask, or the config is wrong. Not planning."
               exit 1 ;;
          esac

      - name: Plan for jodidaniel
        id: plan_jodidaniel
        env:
          GH_TOKEN: ${{ steps.token_jodidaniel.outputs.token }}
          OWNER: jodidaniel
        run: |
          set -uo pipefail
          rc=0
          python scripts/repo_settings.py diff --config repo-settings/fleet.yml --owner "$OWNER" \
            --changes-json "changes-$OWNER.json" || rc=$?
          case "$rc" in
            0) echo "drift=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "drift=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::diff for $OWNER exited $rc: it could not ask, or the config is wrong. Not planning."
               exit 1 ;;
          esac

      # What the reviewer of the apply reads before approving (issue #102
      # follow-up): GitHub's approval dialog cannot carry text or links, so
      # the plan goes on the run page instead, as a job-summary table plus
      # up to 10 notices. GitHub keeps 10 notices per step and drops the rest
      # silently, so changes-report spends the 10th on an all-caps heads-up
      # when there are more. Runs even after a failed plan step, and may not
      # fail the run: a missing summary is no reason to withhold the apply.
      - name: Summarize planned changes
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OWNERS: Adam-S-Daniel jodidaniel
          SUMMARY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          files=()
          missing=""
          for OWNER in $OWNERS; do
            if [[ -f "changes-$OWNER.json" ]]; then
              files+=("changes-$OWNER.json")
            else
              missing+=" $OWNER"
            fi
          done
          if (( ${#files[@]} )); then
            python scripts/repo_settings.py changes-report "${files[@]}" --format markdown >> "$GITHUB_STEP_SUMMARY"
            python scripts/repo_settings.py changes-report "${files[@]}" --format annotations --summary-url "$SUMMARY_URL"
          fi
          if [[ -n "${missing:-}" ]]; then
            printf '\n**No plan for:%s.** Its plan step failed; this summary is incomplete.\n' "$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=repo-settings plan::NO PLAN FOR:$missing. THE SUMMARY IS INCOMPLETE."
          fi

      # AFTER the plan, and it may not fail the run. A repo nobody has
      # declared yet is not a reason to withhold the settings the declared
      # ones are owed -- and a plan that goes red because someone created a
      # repo would also stop the apply on push.
      #
      # The App is installed on ALL repositories in both accounts, and
      # `fleet.yml` was kept equal to that set by hand, with nothing checking
      # that the two stay equal. A repo created next month gets no ruleset,
      # no SHA-pinning enforcement and no fork-PR approval, and says nothing
      # about it -- the same silence
      # `skills_bootstrap` had before _agent-guidance's ADR 0011.
      #
      # The read App's installation token enumerates (only an installation
      # token can ask /installation/repositories what it can reach); the REPO
      # token files the issue. Both owners in one step, so the step keeps one
      # id; each owner's exit code is its own output, `rc_<OWNER KEY>`.
      - name: Which repos does fleet.yml not declare?
        id: coverage
        continue-on-error: true
        env:
          OWNERS: Adam-S-Daniel jodidaniel
          TOKEN_ADAM_S_DANIEL: ${{ steps.token_adam.outputs.token }}
          TOKEN_JODIDANIEL: ${{ steps.token_jodidaniel.outputs.token }}
        run: |
          set -uo pipefail
          for OWNER in $OWNERS; do
            key=$(tr 'a-z-' 'A-Z_' <<<"$OWNER")
            token_var="TOKEN_$key"
            # No --show-private here: this log is public. See cmd_coverage.
            # GitHub runs this under `bash -e`; `|| rc=$?` keeps a nonzero exit
            # from killing the script before rc is recorded and the report shown.
            rc=0
            GH_TOKEN="${!token_var:-}" python scripts/repo_settings.py coverage \
              --config repo-settings/fleet.yml --owner "$OWNER" \
              > "coverage-$OWNER.txt" 2>&1 || rc=$?
            # Three-valued, and the middle one is the whole point: 0 complete,
            # 1 something undeclared, 2 the question could not be asked. A `2`
            # must never reach the issue step as "nothing undeclared".
            echo "rc_$key=$rc" >> "$GITHUB_OUTPUT"
            cat "coverage-$OWNER.txt"
          done
          exit 0

      # continue-on-error: a nudge that cannot file its issue must not fail the
      # plan, because a failed plan withholds the apply on push.
      - name: Nudge on repos fleet.yml does not declare
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNERS: Adam-S-Daniel jodidaniel
          RC_ADAM_S_DANIEL: ${{ steps.coverage.outputs.rc_ADAM_S_DANIEL }}
          RC_JODIDANIEL: ${{ steps.coverage.outputs.rc_JODIDANIEL }}
        run: |
          set -euo pipefail
          nudge() {
            local OWNER=$1 RC=$2
            # EXPORTED, because the jq filter below reads it as `env.title`.
            # A shell local would be invisible there, the filter would match
            # nothing, and every run would open a fresh duplicate issue while
            # never closing one.
            export title="Undeclared in fleet.yml: $OWNER"
            local report="coverage-$OWNER.txt" existing

            if [[ "${RC:-2}" == "2" ]]; then
              echo "::warning::coverage could not enumerate $OWNER — concluding nothing, and leaving any open nudge alone"
              return 0
            fi

            existing=$(gh issue list --state open --label ci \
              --search "$title in:title" --json number,title \
              --jq "[.[] | select(.title == env.title)] | .[0].number // empty")

            if [[ "$RC" == "0" ]]; then
              if [[ -n "$existing" ]]; then
                gh issue close "$existing" --comment \
                  "Every repository the App can administer under \`$OWNER\` is now declared in \`fleet.yml\`. Closed by the weekly run."
              fi
              return 0
            fi

            # Body from a file, never an argument: repo names are data, and the
            # command line is echoed into a log.
            {
              echo "The repo-settings App can administer repositories under \`$OWNER\` that \`repo-settings/fleet.yml\` does not declare."
              echo
              echo "Undeclared means nobody has decided about them -- not that they should be managed. Declaring one with \`manage: []\` is a perfectly good answer, and is what the two forks carry today; what is not an answer is absence, because absence and a deliberate omission look identical."
              echo
              echo "Until a repo is declared it gets no ruleset, no SHA-pinning enforcement and no fork-PR approval requirement, and nothing says so."
              echo
              echo '```'
              grep '^UNDECLARED' "$report" || true
              echo '```'
              echo
              echo "Names of undeclared private repositories are withheld because this issue is public. To see them, run \`python3 scripts/repo_settings.py coverage --config repo-settings/fleet.yml --owner $OWNER --show-private\` locally."
              echo
              echo "Add each to \`repos:\` in \`repo-settings/fleet.yml\`, with \`manage: [\"all\"]\` to manage it or \`manage: []\` to leave it alone. This issue closes itself on the next weekly run."
            } > /tmp/coverage-body.md

            if [[ -n "$existing" ]]; then
              gh issue edit "$existing" --body-file /tmp/coverage-body.md
            else
              gh issue create --title "$title" --label ci --body-file /tmp/coverage-body.md
            fi
          }

          for OWNER in $OWNERS; do
            key=$(tr 'a-z-' 'A-Z_' <<<"$OWNER")
            rc_var="RC_$key"
            nudge "$OWNER" "${!rc_var:-}"
          done

  # The unreviewed apply (docs/decisions/0019). The owner used to approve every
  # apply, and almost every plan he approved only added protection. This job
  # makes those writes with no approval, and nothing else: `--refuse-weakening`
  # has the engine classify each planned write and make only the ones it can
  # show cannot leave a repo with fewer constraints. Everything else is left
  # for the reviewed `repo-settings` job below, which this job's outputs
  # decide whether to run.
  #
  # It holds the admin key, so the same rules as the reviewed job apply: never
  # on pull_request, and the key comes from an environment only `main` may
  # deploy to. That environment, `fleet-apply-auto`, has no reviewer; the
  # control is the classifier, enforced at the write and not only in the
  # routing here. If the environment is not set up (no key, or not main-only)
  # the job applies nothing, says so, and asks for the review as before.
  #
  # It re-plans instead of reading the `plan` job's answer: the plan's token is
  # read-only and cannot see bypass actors, Actions policies or merge flags,
  # and a verdict needs them.
  #
  # A matrix, with one output per owner: each leg sets only its own, so the
  # legs cannot overwrite each other. `false` is the only value that withholds
  # the review; an empty output (a leg that died first) asks for it.
  #
  # Its own concurrency group, not the reviewed job's: a reviewed leg waiting
  # for approval holds its group, and this job must not queue behind it.
  apply-auto:
    runs-on: ubuntu-latest
    needs: plan
    # The same conditions the reviewed apply had before this job existed (issue
    # #116); tests/test_repo_settings_workflow_token.py holds the two together.
    if: >-
      ${{ !cancelled()
      && vars.REPO_SETTINGS_APP_CLIENT_ID != ''
      && github.event_name != 'pull_request'
      && ((github.event_name == 'schedule'
      && (needs.plan.result != 'success' || needs.plan.outputs.needs_apply == 'true'))
      || (needs.plan.result == 'success'
      && ((github.event_name == 'push' && needs.plan.outputs.needs_apply == 'true')
      || (github.event_name == 'workflow_dispatch' && !inputs.dry_run
      && (needs.plan.outputs.needs_apply == 'true' || inputs.force_apply))))) }}
    environment: fleet-apply-auto
    concurrency:
      group: repo-settings-auto-${{ matrix.owner }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        owner: [Adam-S-Daniel, jodidaniel]
    outputs:
      review_ADAM_S_DANIEL: ${{ steps.decide.outputs.review_ADAM_S_DANIEL }}
      review_JODIDANIEL: ${{ steps.decide.outputs.review_JODIDANIEL }}
    steps:
      # Naming an environment that does not exist creates it, with no rules and
      # no secrets. So ask what `fleet-apply-auto` is before using it: it must
      # hold the key and let only `main` deploy. Not set up is not a failure:
      # the job applies nothing and the reviewed apply takes the whole plan.
      # The key behind an environment any branch may deploy to IS a failure,
      # because a workflow on any branch could then read it.
      - name: Is the unreviewed lane set up?
        id: auto_gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENVIRONMENT: fleet-apply-auto
          HAS_KEY: ${{ secrets.REPO_SETTINGS_APP_PRIVATE_KEY != '' }}
          # The files an apply reads: this workflow's own `on.push.paths`
          # (tests/test_repo_settings_workflow_token.py holds the two equal).
          APPLY_INPUTS: repo-settings/fleet.yml scripts/repo_settings.py .github/workflows/repo-settings.yml requirements.txt
        run: |
          set -uo pipefail
          provisioned=false
          main_only=false
          why=""
          if ! env_json=$(gh api "repos/$REPO/environments/$ENVIRONMENT"); then
            why="it could not be read"
          elif ! policies_json=$(gh api "repos/$REPO/environments/$ENVIRONMENT/deployment-branch-policies"); then
            why="its deployment-branch policies could not be read"
          elif ! jq -e '.deployment_branch_policy.custom_branch_policies == true' <<<"$env_json" >/dev/null; then
            why="it does not restrict deployments to selected branches"
          elif ! jq -e '.total_count == 1 and ([.branch_policies[]? | [.name, (.type // "branch")]] == [["main", "branch"]])' \
              <<<"$policies_json" >/dev/null; then
            why="its deployment-branch policies are not exactly the branch main"
          else
            main_only=true
          fi
          if [[ "$main_only" == "true" && "$HAS_KEY" == "true" ]]; then
            provisioned=true
          elif [[ "$main_only" == "true" ]]; then
            why="it has no REPO_SETTINGS_APP_PRIVATE_KEY secret"
          fi
          # An apply converges the fleet on the commit it runs from. A run
          # main has moved past (a queued or re-run job) would apply an older
          # config over a newer one, so it applies nothing: the push that
          # changed those files started its own run.
          stale=""
          if [[ "$provisioned" == "true" ]]; then
            if ! compare_json=$(gh api "repos/$REPO/compare/$GITHUB_SHA...main"); then
              stale="this commit could not be compared with main"
            elif ! jq -e --arg inputs "$APPLY_INPUTS" '
              ($inputs | split(" ")) as $p
              | .behind_by == 0
              and (.files | type) == "array"
              and (.files | length) < 300
              and (.files | all((.filename | type) == "string"))
              and ([.files[] | .filename, (.previous_filename // empty)]
                   | all(. as $n | $p | index($n) == null))' <<<"$compare_json" >/dev/null; then
              stale="main has moved past this commit and changed a file an apply reads"
            fi
            if [[ -n "$stale" ]]; then provisioned=false; fi
          fi
          echo "provisioned=$provisioned" >> "$GITHUB_OUTPUT"
          if [[ -n "$stale" ]]; then
            echo "::error::Nothing applied: $stale. The run on main's newest commit applies the current settings."
            exit 1
          elif [[ "$provisioned" == "true" ]]; then
            echo "Environment $ENVIRONMENT holds the key, only main may deploy, and this commit's settings are main's."
          elif [[ "$HAS_KEY" == "true" ]]; then
            echo "::error::Environment $ENVIRONMENT holds the admin key but $why. Allow only main, or remove the key."
            exit 1
          else
            echo "::notice title=repo-settings unreviewed apply::Not used: environment $ENVIRONMENT is not set up ($why). Every change waits for the reviewed apply."
          fi

      - name: Checkout
        if: ${{ steps.auto_gate.outputs.provisioned == 'true' }}
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        if: ${{ steps.auto_gate.outputs.provisioned == 'true' }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        if: ${{ steps.auto_gate.outputs.provisioned == 'true' }}
        run: python3 -m pip install -r requirements.txt

      - name: Mint GitHub App token for ${{ matrix.owner }}
        id: token
        if: ${{ steps.auto_gate.outputs.provisioned == 'true' }}
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.REPO_SETTINGS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SETTINGS_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}

      # Exit 0 (nothing left) and 3 (something left for review) both let the
      # labels leg run; the last step reads the code and fails the job on any
      # other. `|| rc=$?` because GitHub runs this under `bash -e`.
      - name: Apply what cannot reduce protection
        id: apply
        if: ${{ steps.auto_gate.outputs.provisioned == 'true' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ matrix.owner }}
        run: |
          set -uo pipefail
          # Under RUNNER_TEMP, never the checkout: the last step must only
          # ever read a result this step wrote.
          rm -f "$RUNNER_TEMP/result-admin.json"
          rc=0
          python scripts/repo_settings.py apply --config repo-settings/fleet.yml --owner "$OWNER" \
            --cms-label-only skip --refuse-weakening --result-json "$RUNNER_TEMP/result-admin.json" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      # The cms-platform repos' labels, under the same issues-only token as in
      # the reviewed job (docs/decisions/0016).
      - name: Which cms-platform repos get labels?
        id: cms_label_repos
        if: ${{ !cancelled() && steps.auto_gate.outputs.provisioned == 'true' }}
        env:
          OWNER: ${{ matrix.owner }}
        run: |
          set -euo pipefail
          repos=$(python scripts/repo_settings.py cms-label-repos --config repo-settings/fleet.yml --owner "$OWNER")
          echo "repos=$repos" >> "$GITHUB_OUTPUT"

      - name: Mint labels-only GitHub App token for ${{ matrix.owner }}
        id: token_labels
        if: ${{ !cancelled() && steps.auto_gate.outputs.provisioned == 'true' && steps.cms_label_repos.outputs.repos != '' }}
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.REPO_SETTINGS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SETTINGS_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ steps.cms_label_repos.outputs.repos }}
          permission-issues: write

      - name: Apply labels to the cms-platform repos
        id: apply_labels
        if: ${{ !cancelled() && steps.auto_gate.outputs.provisioned == 'true' && steps.cms_label_repos.outputs.repos != '' }}
        env:
          GH_TOKEN: ${{ steps.token_labels.outputs.token }}
          OWNER: ${{ matrix.owner }}
        run: |
          set -uo pipefail
          rm -f "$RUNNER_TEMP/result-labels.json"
          rc=0
          python scripts/repo_settings.py apply --config repo-settings/fleet.yml --owner "$OWNER" \
            --cms-label-only only --refuse-weakening --result-json "$RUNNER_TEMP/result-labels.json" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      # Writes the summary the reviewer reads, and this owner's `review_*`
      # output. `false` only when the lane is set up, every apply step wrote
      # its result file and exited 0, 2 or 3 (the engine's own codes), and no
      # result is a change left behind or a setting it could not read.
      # Anything else, a step that died included, leaves the output `true`.
      # Then it fails the job if a write failed.
      - name: Summarize, and say whether a review is still needed
        id: decide
        if: ${{ !cancelled() }}
        env:
          OWNER: ${{ matrix.owner }}
          PROVISIONED: ${{ steps.auto_gate.outputs.provisioned }}
          ADMIN_RC: ${{ steps.apply.outputs.rc }}
          LABEL_REPOS_OUTCOME: ${{ steps.cms_label_repos.outcome }}
          LABEL_REPOS: ${{ steps.cms_label_repos.outputs.repos }}
          LABELS_RC: ${{ steps.apply_labels.outputs.rc }}
        run: |
          set -uo pipefail
          key=$(tr 'a-z-' 'A-Z_' <<<"$OWNER")
          review=true
          failed=0
          if [[ "$PROVISIONED" == "true" ]]; then
            files=()
            complete=true
            admin="$RUNNER_TEMP/result-admin.json"
            labels="$RUNNER_TEMP/result-labels.json"
            if [[ -f "$admin" ]]; then files+=("$admin"); else complete=false; fi
            if [[ "$LABEL_REPOS_OUTCOME" != "success" ]]; then
              complete=false
            elif [[ -n "$LABEL_REPOS" ]]; then
              if [[ -f "$labels" ]]; then files+=("$labels"); else complete=false; fi
            fi
            # A step that should have run but recorded no code was ended
            # partway, perhaps after it wrote its file.
            if [[ -z "$ADMIN_RC" ]]; then complete=false; fi
            if [[ -n "$LABEL_REPOS" && -z "$LABELS_RC" ]]; then complete=false; fi
            # 0: nothing left. 3: something left. 2: a write or a read failed,
            # and the results say which. Any other code is a crash, and what
            # is on disk is then not this run's answer.
            for rc in "$ADMIN_RC" "$LABELS_RC"; do
              case "$rc" in
                0|3|"") ;;
                2) failed=1
                   echo "::error::An unreviewed apply step for $OWNER exited 2: a write or a read failed." ;;
                *) failed=1
                   complete=false
                   echo "::error::An unreviewed apply step for $OWNER exited $rc without finishing." ;;
              esac
            done
            if (( ${#files[@]} )); then
              python scripts/repo_settings.py apply-report "${files[@]}" --format markdown >> "$GITHUB_STEP_SUMMARY" || true
            fi
            if [[ "$complete" == "true" ]]; then
              answer=$(python scripts/repo_settings.py apply-report "${files[@]}" --format needs-review) || answer=""
              case "$answer" in
                false) review=false ;;
                true) ;;
                *) failed=1
                   echo "::error::The unreviewed apply's results for $OWNER could not be read, so the reviewed apply is asked for." ;;
              esac
            else
              failed=1
              echo "::error::The unreviewed apply for $OWNER did not finish, so the reviewed apply is asked for."
            fi
          else
            printf '## Applied without review\n\nNothing for %s: the unreviewed apply did not run (its first step says why). Every change waits for the reviewed apply.\n' "$OWNER" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "review_$key=$review" >> "$GITHUB_OUTPUT"
          echo "$OWNER: review still needed: $review"
          exit "$failed"

  repo-settings:
    runs-on: ubuntu-latest
    needs: [plan, apply-auto]
    # The reviewed apply. Runs only when `apply-auto` left a change behind, or
    # did not say `false` for every owner (not set up, or it died first), and
    # (issue #116):
    #   * the event is `schedule` and the plan found drift, or the plan did
    #     not succeed (say the read App is broken): a weekly run that cannot
    #     rule drift out still applies, failing closed;
    #   * the plan succeeded and found drift, on push or on a dispatch that is
    #     not a dry run;
    #   * the plan succeeded and a dispatch that is not a dry run sets
    #     `force_apply`.
    # A dry-run dispatch never gets here: it is the plan alone. Outside
    # schedule, a failed or skipped plan never triggers an apply.
    #
    # `!cancelled()` because GitHub skips a dependent job whose `needs` failed
    # unless `if:` calls a status function; the failed-plan schedule case needs that,
    # and so does an `apply-auto` that failed. Every other branch requires
    # `needs.plan.result == 'success'`. Not `always()`: a run someone cancelled
    # should not go on to ask for an apply.
    #
    # Both owners' legs run when either owner needs the review: a job-level
    # `if:` cannot read the matrix, and a leg with nothing left changes nothing.
    #
    # Skip cleanly until the admin App is configured. Never on pull_request:
    # a PR branch controls its own copy of this file, so the job that holds
    # the admin key must not run there at all; `drift` below covers PRs.
    if: >-
      ${{ !cancelled()
      && vars.REPO_SETTINGS_APP_CLIENT_ID != ''
      && github.event_name != 'pull_request'
      && (needs.apply-auto.outputs.review_ADAM_S_DANIEL != 'false'
      || needs.apply-auto.outputs.review_JODIDANIEL != 'false')
      && ((github.event_name == 'schedule'
      && (needs.plan.result != 'success' || needs.plan.outputs.needs_apply == 'true'))
      || (needs.plan.result == 'success'
      && ((github.event_name == 'push' && needs.plan.outputs.needs_apply == 'true')
      || (github.event_name == 'workflow_dispatch' && !inputs.dry_run
      && (needs.plan.outputs.needs_apply == 'true' || inputs.force_apply))))) }}
    # The approval gate. GitHub pauses the job here, before its first step,
    # until a required reviewer approves, and serves the environment's secrets
    # only after that.
    environment: fleet-apply
    # Serialize applies per owner, here and not at workflow level. A run waiting
    # for approval holds its group, so a workflow-level group would make PR
    # `drift` runs queue behind it or replace each other. The group carries the
    # matrix owner: one fixed name would put both legs in one group, so they
    # would run one after another (likely two approvals), and a newly queued
    # run would cancel the waiting leg, applying to one owner only.
    concurrency:
      group: repo-settings-${{ matrix.owner }}
      cancel-in-progress: false
    # Job-level permissions replace the workflow-level block, so restate it.
    # `actions: read` is what the environment self-check's two GETs need. No
    # `issues: write`: the nudge moved to `plan`.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        owner: [Adam-S-Daniel, jodidaniel]
    steps:
      # Naming an environment that does not exist does not fail: GitHub creates
      # it with no protection rules, and the gate silently disappears (issue
      # #13, property 4). So before anything applies, ask GitHub what
      # `fleet-apply` actually enforces and refuse unless it has a required
      # reviewer and deploys from `main` only. Fails closed: any API error or
      # unreadable response fails the job. No `if:` and no
      # `continue-on-error`, on purpose; tests/test_repo_settings_workflow_token.py
      # holds it first and runs this script against fake responses.
      - name: Check the fleet-apply environment still gates this job
        id: environment_gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENVIRONMENT: fleet-apply
          # The files an apply reads: this workflow's own `on.push.paths`.
          APPLY_INPUTS: repo-settings/fleet.yml scripts/repo_settings.py .github/workflows/repo-settings.yml requirements.txt
        run: |
          set -euo pipefail
          env_json=$(gh api "repos/$REPO/environments/$ENVIRONMENT")
          policies_json=$(gh api "repos/$REPO/environments/$ENVIRONMENT/deployment-branch-policies")
          if ! jq -e '[.protection_rules[]? | select(.type == "required_reviewers") | (.reviewers // []) | length] | any(. > 0)' \
              <<<"$env_json" >/dev/null; then
            echo "::error::Environment $ENVIRONMENT has no required reviewer, so nothing gates the admin key. Add one before applying."
            exit 1
          fi
          if ! jq -e '.deployment_branch_policy.custom_branch_policies == true' <<<"$env_json" >/dev/null; then
            echo "::error::Environment $ENVIRONMENT does not restrict deployments to selected branches. Allow only main."
            exit 1
          fi
          if ! jq -e '.total_count == 1 and ([.branch_policies[]? | [.name, (.type // "branch")]] == [["main", "branch"]])' \
              <<<"$policies_json" >/dev/null; then
            echo "::error::Environment $ENVIRONMENT's deployment-branch policies are not exactly the branch main."
            exit 1
          fi
          echo "Environment $ENVIRONMENT: a required reviewer is configured and only main may deploy."
          # An approval can arrive long after the run started. If main has
          # since changed a file an apply reads, this job would put an older
          # config over a newer one, undoing whatever the newer commit's
          # unreviewed apply already tightened, and the plan the reviewer saw
          # would not show it. Refuse; the newer commit's run is the one to
          # approve. (ADR 0019.)
          compare_json=$(gh api "repos/$REPO/compare/$GITHUB_SHA...main")
          if ! jq -e --arg inputs "$APPLY_INPUTS" '
            ($inputs | split(" ")) as $p
            | .behind_by == 0
            and (.files | type) == "array"
            and (.files | length) < 300
            and (.files | all((.filename | type) == "string"))
            and ([.files[] | .filename, (.previous_filename // empty)]
                 | all(. as $n | $p | index($n) == null))' <<<"$compare_json" >/dev/null; then
            echo "::error::Not applied: main has moved past this run's commit and changed a file an apply reads. Approve the run on main's newest commit instead."
            exit 1
          fi
          echo "This commit's settings are still main's."

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install -r requirements.txt

      - name: Mint GitHub App token for ${{ matrix.owner }}
        id: token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.REPO_SETTINGS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SETTINGS_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}

      # The cms-platform repos are applied below, under their own token.
      - name: Apply
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ matrix.owner }}
        run: python scripts/repo_settings.py apply --config repo-settings/fleet.yml --owner "$OWNER" --cms-label-only skip

      # Least privilege for the cms-platform-managed repos (docs/decisions/0016).
      # They are labels-only, so their writes run under a token minted with
      # only `issues: write`, narrowed to those repos: an engine bug cannot
      # make an Administration write there. The App key itself can mint
      # anything, so this narrows the engine's reach, not the job's.
      #
      # `!cancelled()` and the gate's outcome, not `always()`: an admin error
      # elsewhere must not withhold these labels, but a failed environment
      # gate must never let this run. The engine's own list of the repos
      # (cms-label-repos) feeds the mint, so the set is defined once.
      - name: Which cms-platform repos get labels?
        id: cms_label_repos
        if: ${{ !cancelled() && steps.environment_gate.outcome == 'success' }}
        env:
          OWNER: ${{ matrix.owner }}
        run: |
          set -euo pipefail
          repos=$(python scripts/repo_settings.py cms-label-repos --config repo-settings/fleet.yml --owner "$OWNER")
          echo "repos=$repos" >> "$GITHUB_OUTPUT"

      # Only `permission-issues: write` (see the least-privilege note above).
      - name: Mint labels-only GitHub App token for ${{ matrix.owner }}
        id: token_labels
        if: ${{ !cancelled() && steps.environment_gate.outcome == 'success' && steps.cms_label_repos.outputs.repos != '' }}
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.REPO_SETTINGS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SETTINGS_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ steps.cms_label_repos.outputs.repos }}
          permission-issues: write

      - name: Apply labels to the cms-platform repos
        if: ${{ !cancelled() && steps.environment_gate.outcome == 'success' && steps.cms_label_repos.outputs.repos != '' }}
        env:
          GH_TOKEN: ${{ steps.token_labels.outputs.token }}
          OWNER: ${{ matrix.owner }}
        run: python scripts/repo_settings.py apply --config repo-settings/fleet.yml --owner "$OWNER" --cms-label-only only

  # The pull_request drift report. It never touches the admin key: a PR branch
  # controls its own copy of this workflow, so any job that can run on a PR
  # could read whatever secret it names (closed PR #95). It mints from a
  # SEPARATE App that holds only read permissions, so its key exposes reads
  # if it ever leaks, and its token is narrowed to read again at mint time.
  #
  # It is the same read-only App the `plan` job uses. SKIPPED while the
  # repo-level variable `REPO_SETTINGS_READ_APP_CLIENT_ID` (and secret
  # `REPO_SETTINGS_READ_APP_PRIVATE_KEY`) is unset (issue #90). Reads that need write (the Actions
  # policies endpoints, GET included) come back as informational skips, never
  # drift (#97). Dependabot and fork PRs get no secrets, so it could never mint
  # there; it is skipped for them instead of failing (#78). It is advisory and
  # not a required check (AGENTS.md).
  drift:
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'pull_request'
        && vars.REPO_SETTINGS_READ_APP_CLIENT_ID != ''
        && github.actor != 'dependabot[bot]'
        && github.event.pull_request.head.repo.full_name == github.repository
      }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        owner: [Adam-S-Daniel, jodidaniel]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install -r requirements.txt

      - name: Mint read-only GitHub App token for ${{ matrix.owner }}
        id: token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.REPO_SETTINGS_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SETTINGS_READ_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          permission-administration: read
          permission-actions: read
          permission-issues: read
          permission-metadata: read

      - name: Drift report
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ matrix.owner }}
        run: python scripts/repo_settings.py diff --config repo-settings/fleet.yml --owner "$OWNER" --changes-json changes.json

      # The same summary and notices the plan job writes, so a PR shows what
      # merging it would ask the reviewer to approve. Runs after a red drift
      # report (drift is red by design here) and may not fail the job.
      - name: Summarize planned changes
        if: ${{ !cancelled() && hashFiles('changes.json') != '' }}
        continue-on-error: true
        env:
          SUMMARY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/repo_settings.py changes-report changes.json --format markdown >> "$GITHUB_STEP_SUMMARY"
          python scripts/repo_settings.py changes-report changes.json --format annotations --summary-url "$SUMMARY_URL"
