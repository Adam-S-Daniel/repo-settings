# Unattended-merge gate for Dependabot PRs.
#
# PROVENANCE: managed by _agent-guidance's scripts/sync.sh. It is delivered to
# every synced repo and OVERWRITTEN whenever it drifts from
# templates/dependabot-auto-merge/ in that repo, so edit the template there,
# not this copy. The three cms-platform-managed repos keep their own
# reusable-workflow path and are never touched.
#
# HOW A DEPENDABOT PR LANDS: this workflow has ONE job, `sweep`, and the
# sweep is the only merge path. It merges a PR only once EVERY check on the
# PR's head has concluded green, at least one from outside this workflow,
# and only when every changed file is on the manifest-path allowlist below.
#
# THE ALLOWLIST (a path alone is not enough for workflow files):
#   - dependency manifests and lockfiles by BASENAME, in any directory
#     (package.json, package-lock.json, Gemfile, Gemfile.lock, pyproject.toml,
#     poetry.lock, requirements*.txt with no "/" in the basename);
#   - .github/workflows/actions.lock, by path alone;
#   - a workflow .yml/.yaml that is a DIRECT child of .github/workflows/ and
#     only when it is a MODIFIED file whose every added or removed line is a
#     `uses:` line (optionally a `- ` list item, optionally a trailing
#     comment): the shape of a Dependabot action bump. A new file, a
#     rename, a missing patch or any other edited line is left for a human.
#
# COMMIT PROVENANCE: the PR author alone proves nothing, since anyone with
# write access can push a commit onto a dependabot/* branch. Every commit on
# the PR must be Dependabot's own and GitHub-verified, or the merge commit
# this sweep's `gh pr update-branch` makes (github-actions[bot], two
# parents). The commit list is fail closed: an API error, an empty list or
# 250+ commits (the endpoint's cap) skips the PR.
#
# BEHIND PRs ARE REFRESHED, NOT MERGED: a PR behind its base would land a
# combination no check ran on, so it is refreshed and the next sweep judges
# the result. An unmeasurable behind-ness skips the PR.
#
# Why no job arms native auto-merge (cms-platform#437): with
# `required_status_checks: []`, `gh pr merge --auto` does not no-op. gh counts
# CLEAN, HAS_HOOKS and UNSTABLE as already mergeable
# (cli/cli, pkg/cmd/pr/merge/merge.go, `isImmediatelyMergeable`), so a PR whose
# checks were still running was merged on the spot. Measured 2026-09-15:
# claude-memory-map#35, a major actions/checkout bump, merged at 21:57:41Z; its
# `test` check started at 21:57:47Z. Auto-merge also waits only for contexts a
# ruleset marks REQUIRED, a list this file cannot see; the sweep reads the
# whole statusCheckRollup, required or not.
#
# The cost is latency: a Dependabot PR lands at the next daily sweep. Version
# updates already wait out a 7-day cooldown (.github/dependabot.yml); a
# security update waits up to a day unless someone merges it by hand.
#
# The changed files come from the pulls/files API, with no checkout, no git and
# no third-party action: the job has no `uses:` at all, so a repo that pins
# actions through a lockfile can take this file unchanged. Only gh and jq,
# both preinstalled on ubuntu-latest, are used.
name: Dependabot auto-merge
run-name: >-
  ${{
    github.event_name == 'schedule' && format('scheduled — {0}', github.event.schedule) ||
    github.event_name == 'workflow_dispatch' && format('manual — @{0}', github.actor) ||
    github.event_name
  }}

on:
  schedule:
    # Daily sweep. It also lands PRs stranded mid-batch the way cms-platform
    # hit in #118-122: see job `sweep`'s header comment.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sweep:
    # THE PROBLEM this job exists to solve (mirrors cms-platform's
    # dependabot-rearm-sweep.yml, #118-122): Dependabot often opens several
    # PRs against the same base in one run. As the first ones merge, every PR
    # still open in the batch goes OUT OF DATE with the new base, and a stale
    # branch is genuinely un-mergeable; only updating the branch can fix it.
    # This job merges DIRECTLY once every check on the PR's head has concluded
    # green, pinned to that head, and refreshes (rather than force-merges) a PR
    # that has fallen behind its base so the next sweep can land it cleanly.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sweep open Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout, so gh has no repository context of its own and would
          # run git to find one (and fail: not a git repository).
          GH_REPO: ${{ github.repository }}
          SELF_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          if [ -z "${SELF_WORKFLOW:-}" ]; then
            echo "::error::SELF_WORKFLOW is empty, so this sweep cannot tell its own jobs' checks from real CI -- refusing to merge anything"
            exit 1
          fi
          echo "::notice::Dependabot auto-merge sweep starting."

          # Captured through a command substitution, never process
          # substitution: `< <(...)` swallows the exit status, so a
          # `gh pr list` that dies on a 401, a rate limit or a network blip
          # would leave PR_NUMBERS empty and fall into the "no open Dependabot
          # PRs" branch below, which exits 0 while its own log line asserts
          # something false. This sweep is the only unattended merge path, and
          # the scheduled-run-health audit scans only for failure /
          # startup_failure / timed_out, so an exit-0 sweep is invisible to
          # the one alarm watching these crons. A genuinely empty result still
          # exits 0; only a failed query goes red.
          #
          # `--limit 100` because `gh pr list` silently defaults to 30, and a
          # truncated page reads exactly like a complete one.
          if ! pr_list=$(gh pr list --state open --author "app/dependabot" \
            --limit 100 --json number --jq '.[].number' 2>&1); then
            echo "::error::could not list open Dependabot PRs — refusing to report an empty sweep: ${pr_list%%$'\n'*}"
            exit 1
          fi

          # An explicit `if` rather than `[ -n "$pr_list" ] && mapfile ...`: a
          # false test makes the AND-list itself non-zero, and whether `set -e`
          # is exempt there is not worth relying on in a job that merges to a
          # protected branch. The emptiness guard is mandatory: `mapfile
          # <<<""` yields ONE empty element, a bogus PR "number".
          PR_NUMBERS=()
          if [ -n "$pr_list" ]; then
            mapfile -t PR_NUMBERS <<<"$pr_list"
          fi

          if [ "${#PR_NUMBERS[@]}" -eq 0 ]; then
            echo "::notice::No open Dependabot PRs — nothing to sweep."
            echo "merged=0 updated=0 skipped=0 blocked=0 failed=0"
            exit 0
          fi

          echo "Open Dependabot PR(s): ${PR_NUMBERS[*]}"
          MERGED=0
          UPDATED=0
          SKIPPED=0
          BLOCKED_PRS=0
          FAILED=0

          # Why the base branch policy is refusing, re-probed whenever the
          # base CHANGES, so a PR on a different base never carries the
          # previous base's diagnosis.
          BLOCKED_CAUSE=""
          BLOCKED_PROBED_BASE=""
          BLOCKED_BASES=""

          diagnose_blocked() {
            local base rules extra approvals
            base="$1"
            # Explicit `if` rather than `cond && return`, for the `set -e`
            # reason above. The emptiness guard is deliberate: an empty base
            # would otherwise compare equal to the initial value on the first
            # call and leave BLOCKED_CAUSE empty.
            if [ -n "$BLOCKED_PROBED_BASE" ] && [ "$base" = "$BLOCKED_PROBED_BASE" ]; then
              return 0
            fi
            BLOCKED_PROBED_BASE="$base"
            case " ${BLOCKED_BASES} " in
              *" ${base} "*) ;;
              *) BLOCKED_BASES="${BLOCKED_BASES}${BLOCKED_BASES:+ }${base}" ;;
            esac

            # The EFFECTIVE rules for the branch, in one read. This endpoint
            # needs only repository read access (unlike GET .../rulesets/{id},
            # which wants admin) and resolves org-level parent rulesets too.
            #
            # `gh api` on an HTTP error prints the error BODY to stdout and
            # exits 1, so `x=$(cmd) || true` would capture that JSON as
            # though it were a result. Discard it explicitly.
            rules=$(gh api "repos/${GITHUB_REPOSITORY}/rules/branches/${base}" 2>/dev/null) || rules=""
            if [ -z "$rules" ]; then
              BLOCKED_CAUSE="could not read the effective branch rules (token scope, or none visible) -- inspect the base branch policy by hand"
              return 0
            fi

            extra=$(jq -r '[.[]? | select(.type=="pull_request") | .parameters.require_extra_approval_for_unattributed_changes] | any' <<<"$rules" 2>/dev/null) || extra=""
            approvals=$(jq -r '[.[]? | select(.type=="pull_request") | .parameters.required_approving_review_count] | first // "unknown"' <<<"$rules" 2>/dev/null) || approvals="unknown"

            if [ "$extra" = "true" ]; then
              BLOCKED_CAUSE="the base branch ruleset sets require_extra_approval_for_unattributed_changes=true, so GitHub requires an approving review for commits not attributed to a user -- which Dependabot's are -- even though required_approving_review_count is ${approvals}. Remedies: declare it false in repo-settings' fleet.yml and have an operator run an apply, or approve these PRs by hand."
              return 0
            fi

            BLOCKED_CAUSE="the base branch policy refused the merge, and its pull_request rule does not set require_extra_approval_for_unattributed_changes -- so look instead for a required review, a required status check that nothing reports, or a second ruleset on this branch (GitHub enforces the union)."
          }

          # Read a PR through `gh pr view --json <fields>` and re-read while
          # GitHub still reports `mergeable` as UNKNOWN. GitHub computes
          # `mergeable` (and with it `mergeStateStatus`) lazily: the first
          # read after the base branch moves answers UNKNOWN and only STARTS
          # the background computation. Treating that first answer as final
          # stranded #296 (the 2026-10-29 sweep logged "skip #296 —
          # mergeable=UNKNOWN"). So: at most 6 re-reads, 10 seconds apart,
          # then give up and let the caller treat it as not ready. Sets
          # READ_JSON to the last read and READ_POLLS to the number of
          # re-reads made. `sleep` is an external command so a test can stub
          # it.
          read_pr() {
            local num="$1" fields="$2" state
            READ_POLLS=0
            READ_JSON=""
            if ! READ_JSON=$(gh pr view "$num" --json "$fields"); then
              READ_JSON=""
              return 1
            fi
            while true; do
              state=$(jq -r '.mergeable // empty' <<<"$READ_JSON" 2>/dev/null) || state=""
              if [ "$state" != "UNKNOWN" ] || [ "$READ_POLLS" -ge 6 ]; then
                break
              fi
              READ_POLLS=$((READ_POLLS + 1))
              sleep 10
              if ! READ_JSON=$(gh pr view "$num" --json "$fields"); then
                READ_JSON=""
                return 1
              fi
            done
            return 0
          }

          # Refresh a stale PR (uses num, base, behind_by, merge_state,
          # touches_workflows from the loop). A stale branch is genuinely
          # un-mergeable, and nothing short of updating it can fix that: the
          # cms-platform #118-122 batch strand, where every merge advances the
          # base and leaves its still-open siblings out of date.
          # `gh pr update-branch` pushes a merge commit onto the head, which
          # starts new checks, so the PR cannot land in THIS sweep BY DESIGN.
          # The next sweep finishes it: UPDATED is a SUCCESS outcome.
          refresh_pr() {
            echo "#${num} — $1 (behind_by=${behind_by}, mergeStateStatus=${merge_state}); refreshing it"
            if gh pr update-branch "$num"; then
              echo "refreshed #${num} against ${base} — its checks now re-run; the next sweep merges it"
              UPDATED=$((UPDATED + 1))
            else
              if [ "$touches_workflows" = "true" ]; then
                # Refreshing a stale workflow-file PR writes workflow content
                # Dependabot never pushed, which GitHub refuses to any
                # identity without `workflows` permission; GITHUB_TOKEN can
                # never hold it. Dependabot can, so a rebase it pushes itself
                # is the fix (fastmail-actions#24).
                echo "::error::#${num} — it is behind ${base} and \`gh pr update-branch\` failed. It changes .github/workflows/, and GITHUB_TOKEN cannot write workflow content Dependabot never pushed. Needs a human: comment \`@dependabot rebase\` on the PR; the next sweep merges it once its checks are green."
              else
                echo "::error::#${num} — it is behind ${base} and \`gh pr update-branch\` failed; needs a human"
              fi
              FAILED=$((FAILED + 1))
            fi
          }

          for num in "${PR_NUMBERS[@]}"; do
            # An unreadable PR still fails the run loudly.
            if ! read_pr "$num" number,baseRefName,headRefOid,mergeable,mergeStateStatus,statusCheckRollup,changedFiles; then
              echo "::error::could not read #${num} with gh pr view"
              exit 1
            fi
            pr_json="$READ_JSON"
            mergeable=$(jq -r '.mergeable' <<<"$pr_json")
            merge_state=$(jq -r '.mergeStateStatus' <<<"$pr_json")
            base=$(jq -r '.baseRefName' <<<"$pr_json")
            head_sha=$(jq -r '.headRefOid' <<<"$pr_json")
            expected_files=$(jq -r '.changedFiles // empty' <<<"$pr_json")

            if [ "$mergeable" != "MERGEABLE" ]; then
              unknown_note=""
              if [ "$mergeable" = "UNKNOWN" ]; then
                unknown_note="; still UNKNOWN after ${READ_POLLS} re-reads"
              fi
              echo "skip #${num} — mergeable=${mergeable} (not ready to merge; will be re-evaluated on the next sweep)${unknown_note}"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # A check-run's `.conclusion` is null while it is still
            # QUEUED/IN_PROGRESS (and `.state` does not exist on it at all;
            # that key belongs to the older commit-status shape), so
            # `(.conclusion // .state) == null` for anything not yet concluded
            # and correctly fails this test. Also require at least one check
            # to exist: an empty rollup means CI has not reported in at all
            # yet, and merging blind on zero signal is the failure mode this
            # gate exists to prevent. The floor below additionally requires
            # that at least one of those checks come from OUTSIDE this
            # workflow, so the gate cannot satisfy itself. A legacy commit
            # status has no `workflowName` and so counts as outside.
            checks_ok=$(jq -r '
              (.statusCheckRollup | length) > 0 and
              (all(.statusCheckRollup[]?; ((.conclusion // .state) as $c | $c == "SUCCESS" or $c == "NEUTRAL" or $c == "SKIPPED")))
            ' <<<"$pr_json")
            if [ "$checks_ok" != "true" ]; then
              echo "skip #${num} — checks not all concluded green yet (mergeStateStatus=${merge_state})"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # An outside check must have SUCCEEDED: a rollup whose only outside
            # entries are SKIPPED or NEUTRAL has not shown any CI passing.
            outside=$(jq -r --arg self "$SELF_WORKFLOW" '
              any(.statusCheckRollup[]?; (.workflowName // "") != $self and (.conclusion // .state) == "SUCCESS")
            ' <<<"$pr_json")
            if [ "$outside" != "true" ]; then
              echo "skip #${num} — no check from outside this workflow (${SELF_WORKFLOW}) has succeeded on its head yet"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::warning::skip #${num} — headRefOid '${head_sha}' is not a 40-hex sha, so the merge cannot be pinned to the commit these checks judged"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # `base` comes from the API and goes into a URL below.
            if ! [[ "$base" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::warning::skip #${num} — base branch name '${base}' has characters this sweep will not put in an API path"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # The changed files, from the API. The list is FAIL CLOSED: a
            # gate that merges after reading a diff it could not read would
            # certify nothing. Captured through a command substitution (never
            # `< <(...)`, which drops the status), and the PR is skipped, not
            # merged, when the call fails, the list is empty, or the number of
            # distinct filenames differs from the PR's `changedFiles` (the
            # endpoint caps at 3000 files and would otherwise look complete).
            # `previous_filename` is emitted too: a file renamed INTO an
            # allowed path (scripts/evil.sh -> package.json) must be judged by
            # its OLD name as well, so it is rejected.
            if ! files_raw=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${num}/files?per_page=100" \
              --jq '.[] | {f: .filename, p: (.previous_filename // null), s: .status, d: .patch} | @json' 2>/dev/null); then
              echo "::warning::skip #${num} — could not list its changed files through the API; not merging a PR whose diff cannot be read"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            if ! file_count=$(jq -rs '[.[].f | select(type == "string")] | unique | length' <<<"$files_raw" 2>/dev/null) \
              || [ -n "${file_count//[0-9]/}" ] || [ -z "$file_count" ] \
              || [ "$file_count" -eq 0 ] || [ "$file_count" != "$expected_files" ]; then
              echo "::warning::skip #${num} — its changed-file list is empty, unreadable or incomplete (listed ${file_count:-?} distinct file(s), the PR reports ${expected_files:-?}); not merging on a partial diff"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            # A newline in a name would split into lines that each look
            # allowed, so refuse any control character outright.
            if ! has_ctl=$(jq -rs 'any(.[] | .f, (.p // empty); test("[\u0001-\u001f]"))' <<<"$files_raw" 2>/dev/null) \
              || [ "$has_ctl" != "false" ]; then
              echo "::warning::skip #${num} — a changed file name contains a control character or cannot be checked; leaving for human review"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            if ! changed_raw=$(jq -rs '.[] | .f, (.p // empty)' <<<"$files_raw" 2>/dev/null); then
              echo "::warning::skip #${num} — could not parse its changed-file list"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            CHANGED=()
            mapfile -t CHANGED <<<"$changed_raw"

            # Pin the file list to the judged head: a push between the
            # snapshot above and the listing would otherwise leave the files
            # of one commit judged against the checks of another.
            if now_json=$(gh pr view "$num" --json headRefOid 2>/dev/null); then
              now_head=$(jq -r '.headRefOid // empty' <<<"$now_json" 2>/dev/null) || now_head=""
            else
              now_head=""
            fi
            if [ -z "$now_head" ] || [ "$now_head" != "$head_sha" ]; then
              echo "::warning::skip #${num} — its head could not be confirmed as ${head_sha:0:7} after the file list was read (now '${now_head:0:7}'); the next sweep judges it afresh"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # Commit provenance (see the header). Fail closed, captured through
            # command substitutions, never `< <(...)`.
            if ! commits_raw=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${num}/commits?per_page=100" \
              --jq '.[] | {sha: .sha, l: (.author.login // ""), v: (.commit.verification.verified == true), np: (.parents | length)} | @json' 2>/dev/null); then
              echo "::warning::skip #${num} — could not list its commits through the API; not merging a PR whose authorship cannot be read"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            if ! commit_count=$(jq -rs 'length' <<<"$commits_raw" 2>/dev/null) \
              || [ -z "$commit_count" ] || [ -n "${commit_count//[0-9]/}" ] \
              || [ "$commit_count" -eq 0 ] || [ "$commit_count" -ge 250 ]; then
              echo "::warning::skip #${num} — its commit list is empty, unreadable or at the API's 250-commit cap (${commit_count:-?}); leaving for human review"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            # The first commit that is neither Dependabot's verified own nor
            # this sweep's merge-from-base. Only sanitized characters of the
            # login are ever printed.
            if ! bad_commit=$(jq -rs '
              [.[] | select(((.l == "dependabot[bot]" and .v == true) or (.l == "github-actions[bot]" and .np == 2)) | not)]
              | first // empty
              | "\(.sha | tostring | gsub("[^0-9a-f]"; "") | .[0:7]) \(.l | gsub("[^A-Za-z0-9_.\\[\\]-]"; ""))"
            ' <<<"$commits_raw" 2>/dev/null); then
              echo "::warning::skip #${num} — could not check its commits; leaving for human review"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            if [ -n "$bad_commit" ]; then
              echo "::warning::skip #${num} — commit ${bad_commit%% *} (author '${bad_commit#* }') is not a verified Dependabot commit or this sweep's own merge from the base; leaving for human review"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # Workflow-file content: of the .yml/.yaml entries directly under
            # .github/workflows/, list those that are NOT a modified file whose
            # added/removed lines are all `uses:` lines (the API patch has only
            # @@ hunks, no ---/+++ headers). Any rename out of a workflow path
            # is listed too. The regex is the one in the header.
            if ! wf_bad=$(jq -rs '
              .[]
              | select(
                  ((.f | test("^[.]github/workflows/[^/]+[.]ya?ml$"))
                    and ((.s != "modified")
                      or ((.d | type) != "string")
                      or (((.d | split("\n")) | map(select(test("^[+-]"))) | all(.[]; test("^[+-][[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*[^[:space:]]+([[:space:]]*#.*)?$"))) | not)))
                  or ((.p // "") | test("^[.]github/workflows/"))
                )
              | .f
            ' <<<"$files_raw" 2>/dev/null); then
              echo "::warning::skip #${num} — could not check its workflow-file changes; leaving for human review"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # The manifest-path allowlist (see the header). Basenames are
            # matched on "${f##*/}" so `*` can never cross a directory.
            # Dependabot never touches anything else, so a path outside this
            # list means a misconfiguration or a tampered branch.
            REJECT=0
            for f in "${CHANGED[@]}"; do
              base_name="${f##*/}"
              case "$f" in
                .github/workflows/actions.lock) ;;
                .github/workflows/*/*)
                  echo "::warning::#${num} touches a nested workflows path: $f"
                  REJECT=1
                  ;;
                .github/workflows/*.yml|.github/workflows/*.yaml)
                  if grep -qxF -- "$f" <<<"$wf_bad"; then
                    echo "::warning::#${num} changes workflow file $f beyond \`uses:\` lines (or it is new, renamed or has no patch)"
                    REJECT=1
                  fi
                  ;;
                *)
                  case "$base_name" in
                    package.json|package-lock.json|Gemfile|Gemfile.lock|pyproject.toml|poetry.lock) ;;
                    requirements*.txt) ;;
                    *)
                      echo "::warning::#${num} touches non-manifest path: $f"
                      REJECT=1
                      ;;
                  esac
                  ;;
              esac
            done
            if [ "$REJECT" = "1" ]; then
              echo "::warning::skip #${num} — diff touches a non-manifest path; leaving for human review"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # GitHub has ALREADY refused this merge when mergeStateStatus is
            # BLOCKED: `mergeable=MERGEABLE` only means "no merge conflict",
            # BLOCKED is the base branch policy saying no. Attempting it
            # anyway produced a daily red naming no cause and no remedy. Skip
            # the doomed attempt and print the diagnosis instead.
            #
            # BEHIND is deliberately NOT caught here: a stale branch is a
            # state this sweep can fix, further down, by refreshing it.
            #
            # mergeStateStatus is answered for the TOKEN asking, and
            # GITHUB_TOKEN can never hold `workflows`. A workflow-file PR that
            # has fallen behind its base therefore reads BLOCKED to this
            # sweep even when the ruleset is satisfied: the merge commit would
            # carry workflow content Dependabot never pushed, which GitHub
            # refuses to write for this identity (as it does for the
            # `gh pr update-branch` below; #296 went red on four sweeps naming
            # causes that did not exist). A base-policy probe answers the
            # wrong question here, so it is not asked.
            #
            # Behind-ness is measured through the compare API because a base
            # that does not require an up-to-date head never says BEHIND, only
            # BLOCKED. A failed or non-numeric measurement skips the PR: a
            # guess of 0 would merge a possibly stale head.
            if ! behind_raw=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${base}...${head_sha}" --jq '.behind_by' 2>/dev/null) \
              || [ -z "$behind_raw" ] || [ -n "${behind_raw//[0-9]/}" ]; then
              echo "::warning::skip #${num} — could not measure how far it is behind ${base}; the next sweep judges it afresh"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            behind_by=$behind_raw
            touches_workflows=false
            for f in "${CHANGED[@]}"; do
              case "$f" in
                .github/workflows/*) touches_workflows=true ;;
              esac
            done

            if [ "$merge_state" = "BLOCKED" ] && [ "$touches_workflows" = "true" ] && [ "$behind_by" -gt 0 ]; then
              echo "::error::blocked #${num} — it changes .github/workflows/ and is ${behind_by} commit(s) behind ${base}, so GITHUB_TOKEN (which cannot hold the \`workflows\` permission) cannot write the merge commit; GitHub reports that as mergeStateStatus=BLOCKED. Not attempting it. Needs a human: comment \`@dependabot rebase\` on the PR; the next sweep merges it once its checks are green."
              BLOCKED_PRS=$((BLOCKED_PRS + 1))
              continue
            fi

            if [ "$merge_state" = "BLOCKED" ]; then
              diagnose_blocked "$base"
              echo "::error::blocked #${num} — mergeable with green checks, but GitHub's base branch policy refuses the merge (mergeStateStatus=BLOCKED); not attempting it. Cause (base ${base}): ${BLOCKED_CAUSE}"
              BLOCKED_PRS=$((BLOCKED_PRS + 1))
              continue
            fi

            # mergeStateStatus says BEHIND only when the base branch REQUIRES
            # an up-to-date head. A base that does not reads a stale PR as
            # CLEAN, so behind_by is consulted too, and decides: a PR behind
            # its base is refreshed WITHOUT a merge attempt, since merging it
            # would land a combination no check ran on.
            if [ "$behind_by" -gt 0 ]; then
              refresh_pr "it is ${behind_by} commit(s) behind ${base}, so merging would land a combination its checks never ran on"
              continue
            fi

            echo "act on #${num} — mergeable, checks green, manifest clean (mergeStateStatus=${merge_state})"

            # `--match-head-commit` pins the merge to the commit this gate
            # judged. Without it, a push landing between the snapshot above
            # and the merge call below (Dependabot rebases its OTHER open PRs
            # every time one of them merges) would merge commits none of these
            # checks ran on. PR number stays LAST: `gh pr merge` takes it
            # positionally.
            if gh pr merge --merge --match-head-commit "$head_sha" "$num"; then
              echo "merged #${num}"
              MERGED=$((MERGED + 1))
              continue
            fi

            if now_json=$(gh pr view "$num" --json headRefOid 2>/dev/null); then
              now_head=$(jq -r '.headRefOid // empty' <<<"$now_json" 2>/dev/null) || now_head=""
            else
              now_head=""
            fi
            if [ -n "$now_head" ] && [ "$now_head" != "$head_sha" ]; then
              echo "skip #${num} — its head moved from ${head_sha:0:7} to ${now_head:0:7} after its checks were judged; GitHub refused the pinned merge, and the next sweep judges the new head"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # The merge was refused. mergeStateStatus=BEHIND with a measured
            # behind_by of 0 still means the base wants an up-to-date head.
            if [ "$merge_state" = "BEHIND" ]; then
              refresh_pr "its merge was refused and mergeStateStatus=BEHIND"
            else
              echo "::error::#${num} — merge was refused and the PR is not behind ${base}; needs a human"
              FAILED=$((FAILED + 1))
            fi
          done

          echo "::notice::Sweep complete — merged=${MERGED} updated=${UPDATED} skipped=${SKIPPED} blocked=${BLOCKED_PRS} failed=${FAILED}"
          echo "merged=${MERGED} updated=${UPDATED} skipped=${SKIPPED} blocked=${BLOCKED_PRS} failed=${FAILED}"

          # Exit non-zero ONLY when a PR could be neither merged, updated, nor
          # legitimately skipped: a red run must mean a human is needed. Two
          # reasons, kept apart in the counters because they want different
          # humans:
          #
          #   blocked=N  GitHub's base branch policy refuses the merge. A
          #              standing POLICY state, named above, not a fault; we
          #              never attempted the merge.
          #   failed=N   we attempted something and it broke unexpectedly.
          #
          # `blocked` fails the run deliberately: it is clearable (the named
          # remedies), finite (it goes away once the ruleset is converged),
          # and the scheduled-run-health audit scans only for failure /
          # startup_failure / timed_out, so an exit-0 sweep is invisible to
          # the one alarm watching these crons.
          if [ "$BLOCKED_PRS" -gt 0 ]; then
            # shellcheck disable=SC2086  # deliberate word-splitting: count bases
            set -- ${BLOCKED_BASES}
            if [ "$#" -gt 1 ]; then
              # BLOCKED_CAUSE holds only the LAST base probed, so naming it
              # here would attribute one branch's policy to every branch.
              echo "::error::${BLOCKED_PRS} Dependabot PR(s) blocked by the base branch policy across $# base branches (${BLOCKED_BASES}) — see the per-PR causes above."
            elif [ -n "$BLOCKED_CAUSE" ]; then
              echo "::error::${BLOCKED_PRS} Dependabot PR(s) blocked by the base branch policy — ${BLOCKED_CAUSE}"
            else
              # Only the workflow-file arm blocked, which never probes the
              # policy, so there is no cause to repeat here.
              echo "::error::${BLOCKED_PRS} Dependabot PR(s) blocked — stale workflow-file PR(s) GITHUB_TOKEN cannot merge; see the per-PR remedy above."
            fi
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::${FAILED} Dependabot PR(s) could be neither merged nor updated — see the errors above."
          fi
          if [ "$BLOCKED_PRS" -gt 0 ] || [ "$FAILED" -gt 0 ]; then
            exit 1
          fi
