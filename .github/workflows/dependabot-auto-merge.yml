# Unattended-merge gate for Dependabot PRs.
#
# THIS REPO'S CONSTRAINT (read before touching either job below): this repo has
# NO default-branch ruleset at all. It is private and the account is not on
# Pro, so GET /repos/{owner}/{repo}/rulesets answers 403 "Upgrade to GitHub Pro
# or make this repository public", and none can be created here. Measured
# 2026-08-29, with the public control (agentskills) returning its ruleset in the
# same run.
#
# `allow_auto_merge` is FALSE on this repo (measured 2026-08-29), and the
# engine is not failing to see it -- it refuses to PLAN it, deliberately.
# `scripts/repo_settings.py:586` gates the setting behind `if is_private():`
# and records a skip reading "private repo without GitHub Pro -- auto-merge
# not available (PATCH returns 200 but is silently ignored)". GitHub offers
# auto-merge on private repos only on Pro/Team/Enterprise; below that the
# PATCH is ACCEPTED, returns 200, and is never honoured, so there is no error
# to catch. Measured 2026-08-11, one apply and a diff seven minutes later on
# the same token: a public repo went CHANGED -> True and read back ok, while
# four private repos went CHANGED -> True and read back False. Without that
# skip every private repo would report a false CHANGED on every apply and
# permanent DRIFT on every PR -- a red check no merge could ever clear
# (repo_settings.py:597-599).
#
# So an operator `apply` under ambient `gh auth` would NOT reconcile it: the
# write path is not what is blocked. Moving the account to Pro/Team/Enterprise,
# or making the repo public, is what would change it -- and repo_settings.py:601
# says to drop that branch if the account ever moves, because the write path
# already works and it is the plan that refuses.
#
# Running private repos without rulesets is a deliberate accepted position
# (owner, 2026-08-29), not an oversight, and no ruleset can grow here while the
# repo stays private off Pro.
#
# BUT NONE OF THE ABOVE IS WHY DEPENDABOT PRS WERE MERGING UNGATED HERE
# (cms-platform#437 --
# https://github.com/Adam-S-Daniel/cms-platform/issues/437). The arming
# question never mattered: `gh pr merge --auto` does not always ARM auto-merge
# -- when it judges a PR already mergeable it merges it immediately instead,
# regardless of whether native auto-merge could ever have armed on this repo
# at all. `gh`'s own source says so directly: `autoMerge: opts.AutoMergeEnable
# && !isImmediatelyMergeable(pr.MergeStateStatus)` (cli/cli
# pkg/cmd/pr/merge/merge.go) -- for a PR whose mergeStateStatus is CLEAN,
# HAS_HOOKS or UNSTABLE, `isImmediatelyMergeable` is true, `autoMerge` is
# false, and `gh` never calls the arm mutation at all; it merges on the spot.
# With no ruleset on this repo, a PR whose OWN checks are still running is
# exactly one of those three states -- GitHub has nothing to hold the merge
# open FOR, so it reports the PR as immediately mergeable the moment
# Dependabot opens it, whether or not some other workflow's checks have
# finished.
#
# Measured on THIS repo: #41 (actions/checkout 7.0.1) was merged by
# github-actions at 22:00:59Z on 2026-09-15; its own `tests / unit` check did
# not conclude until 22:01:02Z, and both `repo-settings` drift-report matrix
# jobs had not concluded either -- they went on to FAIL at 22:01:06Z and
# 22:01:20Z, on a PR that had already merged.
#
# THE FIX: job `auto-merge` below no longer attempts a merge at all -- it only
# enforces the manifest-path allowlist and disarms/fails on anything outside
# it. Job `sweep` is now the ONLY path that merges a Dependabot PR unattended,
# and it merges DIRECTLY (never via `--auto`) once EVERY check reported on the
# PR's head has concluded green -- with at least one of them from OUTSIDE this
# workflow, so job `auto-merge`'s own SUCCESS can't by itself satisfy that
# floor -- pinned to that head commit. With no ruleset possible on this repo,
# native auto-merge could never have HELD a merge open for anything here
# anyway; the sweep is this repo's only real gate.
#
# THE COST IS LATENCY. A Dependabot PR now lands at the next daily sweep
# instead of the instant its actor opens it. Version-update PRs already wait a
# 7-day cooldown (`.github/dependabot.yml`), so a further same-day wait is
# negligible against that; a security-update PR (which bypasses the cooldown)
# can wait up to a day for the scheduled sweep unless merged by hand.
#
# A CONSEQUENCE WORTH NAMING: the `repo-settings` drift-report job runs on any
# PR touching `.github/workflows/repo-settings.yml` and FAILS on Dependabot
# PRs, because Dependabot-triggered workflow runs receive no Actions secrets
# (the App private key is empty) -- that is what actually failed on #41, one
# and twenty seconds after the PR had already merged. Under this gate such a
# PR is never merged unattended: `sweep` sees an unfinished, still-red check
# and skips the PR, naming it in its log, until a human looks at it. That is
# the gate doing its job. Whether to exempt that job for Dependabot PRs
# specifically is a separate decision for the owner to make -- it is not made
# here.
#
# DO NOT generalise the paragraph above -- the one beginning "BUT NONE OF THE
# ABOVE IS WHY" -- into "no required check is why Dependabot PRs don't land."
# It is a claim about `gh pr merge --auto`'s ARMING behaviour, and nothing
# more. The thing that has actually been refusing these merges fleet-wide, on
# repos that DO carry a ruleset, is a different, independent ruleset parameter
# -- `require_extra_approval_for_unattributed_changes` -- which demands an
# approving review for commits not attributed to a user, which Dependabot's
# are, even where `required_approving_review_count` is 0. The discriminator
# is attributed-vs-unattributed AUTHORSHIP, not required checks: agentskills
# HAS a required check (`pytest-windows`) and measured that parameter true
# like every other visible fleet ruleset (2026-08-20). See
# repo-settings/schema.md, "The unattributed-changes parameter", and job
# `sweep`'s BLOCKED gate below.
#
# Not a `workflow_call` reusable (unlike cms-platform's
# .github/workflows/dependabot-auto-merge.yml, which a thin per-site caller
# invokes) — this repo isn't part of that fleet, so this file owns its own
# triggers directly. Style, comments, and the manifest-path allowlist logic
# are ported from cms-platform's dependabot-auto-merge.yml +
# scripts/check-dependabot-manifest-paths.sh. This repo has no shared
# scripts/ directory, so the allowlist is INLINED in both jobs below rather
# than factored into a script — keep the two copies in lockstep if you
# change it.
name: Dependabot auto-merge
run-name: >-
  ${{
    github.event_name == 'pull_request' && format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title) ||
    github.event_name == 'schedule' && format('scheduled — {0}', github.event.schedule) ||
    github.event_name == 'workflow_dispatch' && format('manual — @{0}', github.actor) ||
    github.event_name
  }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # This daily sweep is the only unattended merge path for a Dependabot PR
    # on this repo (see header) -- and it also lands PRs stranded mid-batch
    # the way cms-platform hit in #118-122 — see job `sweep`'s header comment
    # for the full story.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # The sweep reads `statusCheckRollup` via `gh pr view`; without these the
  # GraphQL call answers "Resource not accessible by integration" (issue #53).
  checks: read
  statuses: read

jobs:
  auto-merge:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch origin "${{ github.event.pull_request.base.ref }}"

      - name: Get Dependabot metadata
        # Validates the PR genuinely came from Dependabot (defence in depth —
        # the job-level `if:` above already gates on the actor).
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98

      - name: Verify only manifest paths changed
        id: paths
        # Path allowlist: dependency manifests/lockfiles (any directory) plus
        # workflow YAML. Dependabot never touches anything else, so a diff
        # outside this list means either a misconfiguration or a tampered
        # branch — either way, refuse to auto-merge. Inline port of
        # cms-platform's scripts/check-dependabot-manifest-paths.sh; keep in
        # lockstep with the identical block in job `sweep` below.
        run: |
          set -euo pipefail
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          mapfile -t CHANGED < <(git diff --name-only "$BASE"..."$HEAD")
          echo "Files changed (${BASE}...${HEAD}):"
          printf '  %s\n' "${CHANGED[@]}"

          REJECT=0
          for f in "${CHANGED[@]}"; do
            case "$f" in
              package.json|*/package.json|package-lock.json|*/package-lock.json) ;;
              Gemfile|*/Gemfile|Gemfile.lock|*/Gemfile.lock) ;;
              pyproject.toml|*/pyproject.toml|poetry.lock|*/poetry.lock) ;;
              requirements*.txt|*/requirements*.txt) ;;
              .github/workflows/*.yml|.github/workflows/*.yaml) ;;
              *)
                echo "::error file=$f::Dependabot PR touches non-manifest path: $f"
                REJECT=1
                ;;
            esac
          done

          if [ "$REJECT" = "1" ]; then
            echo "safe=false" >> "$GITHUB_OUTPUT"
          else
            echo "safe=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Disable auto-merge (path check failed)
        if: steps.paths.outputs.safe == 'false'
        run: |
          gh pr merge --disable-auto "$PR_URL" || true
          echo "::error::PR touches paths outside the dependency-manifest allowlist; auto-merge disabled."
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sweep:
    # THE PROBLEM this job exists to solve (mirrors cms-platform's
    # dependabot-rearm-sweep.yml, #118-122): even where native auto-merge
    # CAN arm, Dependabot often opens several PRs against the same base in
    # one run. As the first ones merge, every PR still open in the batch
    # goes OUT OF DATE with the new base — and a stale branch is genuinely
    # un-mergeable, which no amount of re-arming auto-merge can fix; only
    # updating the branch can. Job `auto-merge` above deliberately merges
    # nothing (see the workflow header), so this job is the ONLY unattended
    # merge path: it merges DIRECTLY once EVERY check on the PR's head has
    # concluded green -- at least one from outside this workflow -- pinned to
    # that head, and refreshes (rather than force-merges) a PR that has
    # fallen behind its base so the next sweep can land it cleanly.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Sweep open Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          if [ -z "${SELF_WORKFLOW:-}" ]; then
            echo "::error::SELF_WORKFLOW is empty, so this sweep cannot tell its own jobs' checks from real CI -- refusing to merge anything"
            exit 1
          fi

          echo "::notice::Dependabot auto-merge sweep starting."

          mapfile -t PR_NUMBERS < <(gh pr list --state open --author "app/dependabot" \
            --json number --jq '.[].number')

          if [ "${#PR_NUMBERS[@]}" -eq 0 ]; then
            echo "::notice::No open Dependabot PRs — nothing to sweep."
            echo "merged=0 updated=0 skipped=0 blocked=0 failed=0"
            exit 0
          fi

          echo "Open Dependabot PR(s): ${PR_NUMBERS[*]}"
          MERGED=0
          UPDATED=0
          SKIPPED=0
          BLOCKED_PRS=0
          FAILED=0

          # Why the base branch policy is refusing, probed at most once per
          # run and reused for every BLOCKED PR (they all share one base).
          BLOCKED_CAUSE=""
          BLOCKED_PROBED=0

          diagnose_blocked() {
            local base rules extra approvals
            base="$1"
            # Explicit `if` rather than `cond && return`: under `set -e` a
            # false `cond` makes the AND-list itself non-zero, and whether
            # that is exempt is exactly the shell subtlety not worth relying
            # on inside a job that merges to a protected branch.
            if [ "$BLOCKED_PROBED" = "1" ]; then
              return 0
            fi
            BLOCKED_PROBED=1

            # The EFFECTIVE rules for the branch, in one read. This endpoint
            # needs only repository read access, unlike GET .../rulesets/{id}
            # which wants admin -- and it resolves org-level parent rulesets
            # too, so it answers "what is actually being enforced here".
            #
            # `gh api` on an HTTP error prints the error BODY to stdout and
            # exits 1, so `x=$(cmd) || true` would capture that JSON as
            # though it were a result. Discard it explicitly.
            rules=$(gh api "repos/${GITHUB_REPOSITORY}/rules/branches/${base}" 2>/dev/null) || rules=""
            if [ -z "$rules" ]; then
              BLOCKED_CAUSE="could not read the effective branch rules (token scope, or none visible) -- inspect the base branch policy by hand"
              return 0
            fi

            extra=$(jq -r '[.[]? | select(.type=="pull_request") | .parameters.require_extra_approval_for_unattributed_changes] | any' <<<"$rules" 2>/dev/null) || extra=""
            approvals=$(jq -r '[.[]? | select(.type=="pull_request") | .parameters.required_approving_review_count] | first // "unknown"' <<<"$rules" 2>/dev/null) || approvals="unknown"

            if [ "$extra" = "true" ]; then
              BLOCKED_CAUSE="the base branch ruleset sets require_extra_approval_for_unattributed_changes=true, so GitHub requires an approving review for commits not attributed to a user -- which Dependabot's are -- even though required_approving_review_count is ${approvals}. Remedies: declare it false in repo-settings' fleet.yml and have an operator run an apply, or approve these PRs by hand."
              return 0
            fi

            BLOCKED_CAUSE="the base branch policy refused the merge, and its pull_request rule does not set require_extra_approval_for_unattributed_changes -- so look instead for a required review, a required status check that nothing reports, or a second ruleset on this branch (GitHub enforces the union)."
          }

          for num in "${PR_NUMBERS[@]}"; do
            pr_json=$(gh pr view "$num" --json number,baseRefName,headRefOid,mergeable,mergeStateStatus,statusCheckRollup)
            mergeable=$(jq -r '.mergeable' <<<"$pr_json")
            merge_state=$(jq -r '.mergeStateStatus' <<<"$pr_json")
            base=$(jq -r '.baseRefName' <<<"$pr_json")
            head_sha=$(jq -r '.headRefOid' <<<"$pr_json")

            if [ "$mergeable" != "MERGEABLE" ]; then
              echo "skip #${num} — mergeable=${mergeable} (not ready to merge; will be re-evaluated on the next sweep)"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # A check-run's `.conclusion` is null while it's still
            # QUEUED/IN_PROGRESS (and `.state` doesn't exist on it at all —
            # that key belongs to the older commit-status shape some
            # actions still use), so `(.conclusion // .state) == null` for
            # anything not yet concluded and correctly fails this test —
            # "pending" and "still running" are treated identically to
            # "not green yet". Also require at least one check to exist:
            # an empty rollup means CI hasn't reported in at all yet
            # (possible webhook lag right after the PR was (re)opened), and
            # merging blind on zero signal is exactly the failure mode this
            # gate exists to prevent.
            #
            # The floor above must be met by a check from OUTSIDE this
            # workflow: job `auto-merge` reports SUCCESS on every Dependabot
            # PR it doesn't reject, so a floor that let its own SUCCESS count
            # toward "at least one check" would be satisfied by the gate
            # itself even when no real CI had run yet (cms-platform#437's
            # #41). A legacy commit status carries no `workflowName` at all,
            # so it correctly counts as outside.
            checks_ok=$(jq -r '
              (.statusCheckRollup | length) > 0 and
              (all(.statusCheckRollup[]?; ((.conclusion // .state) as $c | $c == "SUCCESS" or $c == "NEUTRAL" or $c == "SKIPPED")))
            ' <<<"$pr_json")
            if [ "$checks_ok" != "true" ]; then
              echo "skip #${num} — checks not all concluded green yet (mergeStateStatus=${merge_state})"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            outside=$(jq -r --arg self "$SELF_WORKFLOW" '
              any(.statusCheckRollup[]?; (.workflowName // "") != $self)
            ' <<<"$pr_json")
            if [ "$outside" != "true" ]; then
              echo "skip #${num} — every check on its head comes from this workflow (${SELF_WORKFLOW}); no CI has reported on it yet"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            if ! git fetch --force origin \
              "refs/heads/${base}:refs/remotes/origin/${base}" \
              "refs/pull/${num}/head:refs/remotes/dependabot-sweep/pr-${num}" \
              >/dev/null 2>&1; then
              echo "::warning::skip #${num} — could not fetch refs for the manifest re-check"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # Re-run the SAME inline manifest-path allowlist as job
            # `auto-merge` above — keep the two blocks in lockstep.
            REJECT=0
            mapfile -t CHANGED < <(git diff --name-only "origin/${base}...dependabot-sweep/pr-${num}")
            for f in "${CHANGED[@]}"; do
              case "$f" in
                package.json|*/package.json|package-lock.json|*/package-lock.json) ;;
                Gemfile|*/Gemfile|Gemfile.lock|*/Gemfile.lock) ;;
                pyproject.toml|*/pyproject.toml|poetry.lock|*/poetry.lock) ;;
                requirements*.txt|*/requirements*.txt) ;;
                .github/workflows/*.yml|.github/workflows/*.yaml) ;;
                *)
                  echo "::warning::#${num} touches non-manifest path on re-check: $f"
                  REJECT=1
                  ;;
              esac
            done
            if [ "$REJECT" = "1" ]; then
              echo "::warning::skip #${num} — diff touches a non-manifest path on re-check; leaving for human review"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # GitHub has ALREADY refused this merge. `mergeable=MERGEABLE`
            # only means "no merge conflict"; mergeStateStatus=BLOCKED is the
            # base branch policy saying no. Attempting it anyway produced the
            # self-contradicting pair this gate replaces:
            #
            #   act on #40 — mergeable, checks green, manifest clean (mergeStateStatus=BLOCKED)
            #   X ...#40 is not mergeable: the base branch policy prohibits the merge.
            #   ::error::#40 — merge was refused and the PR is not behind main; needs a human
            #
            # -- a daily red naming no cause and no remedy. Skip the doomed
            # attempt and print the diagnosis instead.
            #
            # BEHIND is deliberately NOT caught here: a stale branch is a
            # state this sweep can fix, and does, further down by refreshing
            # the branch rather than retrying the merge.
            if [ "$merge_state" = "BLOCKED" ]; then
              diagnose_blocked "$base"
              echo "::error::blocked #${num} — mergeable with green checks, but GitHub's base branch policy refuses the merge (mergeStateStatus=BLOCKED); not attempting it. Cause: ${BLOCKED_CAUSE}"
              BLOCKED_PRS=$((BLOCKED_PRS + 1))
              continue
            fi

            if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::warning::skip #${num} — headRefOid '${head_sha}' is not a 40-hex sha, so the merge cannot be pinned to the commit these checks judged"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            echo "act on #${num} — mergeable, checks green, manifest clean (mergeStateStatus=${merge_state})"

            # --match-head-commit pins the merge to the commit the gate above
            # just judged. Without it, a push landing between the snapshot
            # taken at the top of this loop and the merge call below would
            # merge commits no check ever ran on -- and that window is not
            # theoretical: Dependabot rebases every one of its other open PRs
            # each time a sibling merges.
            if gh pr merge --merge --match-head-commit "$head_sha" "$num"; then
              echo "merged #${num}"
              MERGED=$((MERGED + 1))
              continue
            fi

            if now_json=$(gh pr view "$num" --json headRefOid 2>/dev/null); then
              now_head=$(jq -r '.headRefOid // empty' <<<"$now_json" 2>/dev/null) || now_head=""
            else
              now_head=""
            fi
            if [ -n "$now_head" ] && [ "$now_head" != "$head_sha" ]; then
              echo "skip #${num} — its head moved from ${head_sha:0:7} to ${now_head:0:7} after its checks were judged; GitHub refused the pinned merge, and the next sweep judges the new head"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            if [ "$merge_state" = "BEHIND" ]; then
              # A stale branch is genuinely un-mergeable, and nothing short
              # of updating it can fix that — this is the exact
              # cms-platform #118-122 batch-strand shape: every merge
              # advances the base and leaves its still-open siblings out of
              # date with it. Refresh, don't retry the merge in THIS run:
              # `gh pr update-branch` pushes a merge commit onto the head,
              # which invalidates the checks this run just verified green
              # and starts new ones — so #${num} cannot land in this sweep
              # BY DESIGN. The next sweep (once the fresh checks go green)
              # finishes it. That's a SUCCESS outcome (UPDATED), not a
              # failure.
              echo "#${num} — merge refused and the PR is behind ${base}; refreshing it instead of retrying"
              if gh pr update-branch "$num"; then
                echo "refreshed #${num} against ${base} — its checks now re-run; the next sweep merges it"
                UPDATED=$((UPDATED + 1))
              else
                echo "::error::#${num} — merge was refused (behind ${base}) and \`gh pr update-branch\` also failed; needs a human"
                FAILED=$((FAILED + 1))
              fi
            else
              echo "::error::#${num} — merge was refused and the PR is not behind ${base}; needs a human"
              FAILED=$((FAILED + 1))
            fi
          done

          echo "::notice::Sweep complete — merged=${MERGED} updated=${UPDATED} skipped=${SKIPPED} blocked=${BLOCKED_PRS} failed=${FAILED}"
          echo "merged=${MERGED} updated=${UPDATED} skipped=${SKIPPED} blocked=${BLOCKED_PRS} failed=${FAILED}"

          # Exit non-zero ONLY when a PR could be neither merged, updated,
          # nor legitimately skipped — a red run must mean a human is
          # needed, same contract as cms-platform's audit-editorial-labels
          # --fix / dependabot-rearm-sweep. Two distinct reasons now, kept
          # apart in the counters because they want different humans:
          #
          #   blocked=N  GitHub's base branch policy refuses the merge. A
          #              standing POLICY state, named above, not a fault —
          #              we never even attempted the merge.
          #   failed=N   we attempted something and it broke unexpectedly.
          #
          # `blocked` fails the run deliberately, and the argument against is
          # real: an alert nobody can clear trains people to ignore alerts.
          # It fails anyway because (a) it IS clearable, by the two named
          # remedies; (b) it is FINITE — it goes away the moment the ruleset
          # is converged, unlike a permanent config warning; and (c) this
          # repo's scheduled-run-health audit only scans for failure /
          # startup_failure / timed_out, so an exit-0 sweep is invisible to
          # the one alarm watching these crons, and a silently stalled
          # dependency pipeline is precisely what that alarm exists to catch.
          # What was wrong before was never the red — it was that the red
          # said nothing.
          if [ "$BLOCKED_PRS" -gt 0 ]; then
            echo "::error::${BLOCKED_PRS} Dependabot PR(s) blocked by the base branch policy — ${BLOCKED_CAUSE}"
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::${FAILED} Dependabot PR(s) could be neither merged nor updated — see the errors above."
          fi
          if [ "$BLOCKED_PRS" -gt 0 ] || [ "$FAILED" -gt 0 ]; then
            exit 1
          fi
