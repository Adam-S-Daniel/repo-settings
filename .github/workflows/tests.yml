# Offline unit tests for the settings engine (no gh/network calls).
name: tests

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (2024-10-23)
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0 (2024-10-31)
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
