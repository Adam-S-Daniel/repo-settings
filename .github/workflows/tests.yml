# Offline unit tests for the settings engine (no gh/network calls).
name: tests

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      # Any workflow change runs the suite. Narrower than this ("just
      # tests.yml") left a Dependabot action-SHA bump to a DIFFERENT workflow
      # file producing zero check-runs on its PR, which the unattended-merge
      # sweep in dependabot-auto-merge.yml refuses to merge on (it requires at
      # least one concluded green check, never zero signal) — so the PR would
      # sit open forever.
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      # Any workflow change runs the suite. Narrower than this ("just
      # tests.yml") left a Dependabot action-SHA bump to a DIFFERENT workflow
      # file producing zero check-runs on its PR, which the unattended-merge
      # sweep in dependabot-auto-merge.yml refuses to merge on (it requires at
      # least one concluded green check, never zero signal) — so the PR would
      # sit open forever.
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
